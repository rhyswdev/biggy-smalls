<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New chat, v4</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/smalls/tokens.css">
<link rel="stylesheet" href="ds/smalls/components/bundle.css">
<script src="ds/smalls/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 100vh; background: var(--surface); color: var(--ink); font-family: var(--font-sans);">
<dc-import name="ChatV4" origin="blank" theme="{{theme}}" hint-size="100%,1000px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
