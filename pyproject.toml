[project]
name = "smalls"
version = "0.1.0"
description = "Smalls: an agentic incident investigation system over raw, multi-source operational evidence"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "jsonschema>=4.22",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smalls", "smalls_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
