[project]
name = "smalls"
version = "0.1.0"
description = "Smalls: an agentic incident investigation system over raw, multi-source operational evidence"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "jsonschema>=4.22",
    # The agent. Minor versions are capped because the event stream and the delta channels are still
    # moving (docs/decisions/tools-agent-build.md section 7.0).
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-sqlite>=3.1,<3.2",
    "langchain>=1.4,<1.5",
    "langchain-core>=1.6,<1.7",
    "langchain-anthropic>=1.7,<1.8",
    "rich>=13",
]

[project.scripts]
smalls = "smalls.cli:main"

[dependency-groups]
dev = ["pytest>=8.2"]
# The classifier SDK. Only `smalls tag` imports it; ingest, the tests and the demo never do.
tagging = ["typesafe-sdk>=0.7.4,<0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smalls", "smalls_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/agent and tests/tools import the helpers that sit in tests/ (parity.py), and the eval harness under eval/.
pythonpath = ["tests", "."]
