# The scorer's own config (docs/decisions/eval-loop.md, section 3 and row S4). The judge is not an agent role:
# its profile is pinned here, so a benchmark that changes the agent's models is always scored by the same judge.
# Model names live only here and in smalls/agent/config.toml.

budget_usd = 9.0            # live judge calls spend up to this without asking (S4; raised from 5 for judge 2's regrade, Z2); the running total is eval/judge/spend.jsonl
claim_chars = 2400          # a longer row keeps its first two thirds and last third, so the judge reads at most this much of it
max_claims = 12             # hypotheses judged per report, leading first

[judge]
provider = "openai"
model = "gpt-6.1-sol"
reasoning = { effort = "high", summary = "auto" }
use_responses_api = true
store = false
timeout_s = 600

[pricing."gpt-6.1-sol"]
input = 2.00
output = 10.00
cache_read = 0.10
cache_write = 2.50
cache_write_1h = 2.50
