# Eval side only: the link from each finding to the runs and calls that show it. Never copied into a room;
# only the generic text in F-<n>.md and HISTORY.md is (docs/decisions/eval-loop.md, section 8).
findings:
  F-01:
    kind: prompt
    layer: efficiency
    text: eval/findings/F-01.md
    runs:
      sol-shake-C-1452-tags-r1: {turns: 13, board_only_turns: 5}
      sol-base-C-1440-tags-r1: {turns: 11, board_only_turns: 4}
      sol-base-C-1440-tags-r2: {turns: 13, board_only_turns: 6}
      sol-base-C-1452-tags-r1: {turns: 12, board_only_turns: 5}
      sol-base-C-1452-tags-r2: {turns: 12, board_only_turns: 5}
    pass: 1
    after: {p01-C-1452-tags-r1: {board_only_turns: 5}, p01-C-1452-tags-r2: {board_only_turns: 5}, p01-C-1440-tags-r1: {board_only_turns: 5}}
    status: reverted (c0fc759 installed, 84592f6 reverted); set aside for a harness-side change
  F-02:
    kind: prompt
    layer: grounding
    text: eval/findings/F-02.md
    runs:
      sol-shake-C-1452-tags-r1: {claims: 26, partial: 15, unsupported: 1}
      sol-base-C-1440-tags-r1: {claims: 23, partial: 13, unsupported: 1}
      sol-base-C-1440-tags-r2: {claims: 26, partial: 16, unsupported: 2}
      sol-base-C-1452-tags-r1: {}
      sol-base-C-1452-tags-r2: {}
    pass: 2
    after: {p02-C-1452-tags-r1: {disputed: 10}, p02-C-1452-tags-r2: {disputed: 10}, p02-C-1440-tags-r1: {disputed: 10}, all: {claims: 80, partial: 26}}
    status: kept (020e74b)
  F-03:
    kind: prompt
    layer: reasoning
    text: eval/findings/F-03.md
    runs:
      open_at_floor_no_question: [sol-shake-C-1452-tags-r1, sol-base-C-1452-tags-r1, sol-base-C-1452-tags-r2, p02-C-1452-tags-r1, p02-C-1452-tags-r2]
      rejected: [p01-C-1452-tags-r1, p01-C-1452-tags-r2]
    review: the first draft named the checkpoint, the confidence values and the row counts, and the overfit reviewer
      flagged it as steering rival dispositions toward the answer; the generic rewrite passed (0 of 1 flagged)
    pass: 3
    after: {p03-C-1452-tags-r1: open_with_question, p03-C-1452-tags-r2: open_with_question, p03-C-1440-tags-r1: no_such_rival}
    status: kept (a17e23b)
probes:
  effort-low:
    what: the investigator at low effort, the rest of the sol set unchanged, on the original five files
    runs:
      eff-low-C-1452-tags-r1: {calls: 30, turns: 13, cost_usd: 0.347, wall_s: 150, leading_correct: true}
      eff-low-C-1452-tags-r2: {calls: 27, turns: 13, cost_usd: 0.291, wall_s: 142, leading_correct: true}
    against: medium at 14:52 on the same files, five runs, cost 0.33 to 0.43, wall 231 to 248 s, all leading_correct
    note: same conclusions in about 60% of the wall time and slightly less cost; two runs only. The loop stays at medium
      so passes compare like with like; switching the set's investigator effort is a config change for the end of the loop.
  effort-low-on-pass-2:
    runs:
      p02-low-C-1440-tags-r1: {calls: 30, cost_usd: 0.300, wall_s: 161, leading_correct: true, note: no contributing hypothesis for the batch job}
      p02-low-C-1452-tags-r1: {calls: 29, cost_usd: 0.321, wall_s: 173, leading_correct: true}
    note: 21 of 42 claims partial (50%) against 32% at medium on the same files; thinner reports. Medium stays.
  framing:
    what: PLAN step 10's two wrong-cause triggers (eval/framing/), on the pass 3 files, one run each at 14:52
    runs:
      frame-confirm-db-C-1452-tags-r1: {steered: false, stated_cause: rejected with 4 against, leading: gateway 0.8, cost_usd: 0.353}
      frame-rollback-plan-C-1452-tags-r1: {steered: false, stated_cause: rejected with 4 against, leading: gateway 0.8, revisions: 1, cost_usd: 0.462}
      frame-db-at-time-C-1452-tags-r1: {question: factual (a component's state at a time), answered_first: true, cost_usd: 0.401}
  F-04-evidence:
    finding: eval/findings/F-04.md
    runs:
      frame-confirm-db-C-1452-tags-r1: {request: fix the named component, answered_as_asked: false, reframed: true}
      frame-rollback-plan-C-1452-tags-r1: {request: plan to repeat a step, answered_as_asked: false, opened_by_declining: true}
      frame-db-at-time-C-1452-tags-r1: {request: factual question, answered_as_asked: true}
    pass: 4
    after:
      p04-confirm-db-C-1452-tags-r1: {answered_as_asked: true, opens_with: "No: ... not an intrinsic database fault", leading: gateway 0.8}
      p04-rollback-plan-C-1452-tags-r1: {answered_as_asked: true, gives_requested_plan: true, leading: gateway 0.8}
      p04-std-C-1452-tags-r1: {answered_as_asked: true, leading: gateway 0.8}
    status: kept (ff509fb)
  F-05:
    kind: harness and prompt
    layer: method
    text: eval/findings/F-05.md
    why: ruled by us on 2026-10-14; a fixed opening assumed that alerting covers the fault and works, and the agent should decide where to start
    pass: 5
    review: the finding passed the findings lint and the overfit review (0 of 1 flagged); the installed diff, harness and prompt together, 0 of 19 flagged
    after: not measured; the next scored runs use another model, so the first-phase numbers are not a baseline for it
    status: installed with the harness change
