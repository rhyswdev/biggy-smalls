# What each batch of live runs was for (docs/decisions/eval-loop.md, ruling V7). `python -m eval.results add`
# refuses a batch that is not described here, and the tuning log prints these words above each batch's table.
# `pass` is the iteration pass whose prompt files the runs used: 0 is the first blind pass's files (row C2b).
# `moved` says, in a sentence, what the batch showed or what its pass changed; the log and the page lead with it.
batches:
  - name: c3
    phase: build
    pass: 0
    what: The first live run (row C3), on the first provider, with the opening sweep. It is the committed run that `make demo` replays.
  - name: sol-shake
    phase: 1
    pass: 0
    what: The shakedown on the second provider's strong tier at medium effort (row L2).
  - name: sol-base
    phase: 1
    pass: 0
    what: The first phase's baseline, two runs at each checkpoint.
  - name: p01
    phase: 1
    pass: 1
    finding: F-01
    result: reverted
    what: Pass 1, board updates sent in turns of their own. The target did not move.
    moved: Board-only turns did not move (5 in each of 3 runs, against 4 to 6 before), and nothing else changed.
  - name: eff-low
    phase: 1
    pass: 0
    what: A probe of the investigator at low effort on the original files.
  - name: p02
    phase: 1
    pass: 2
    finding: F-02
    result: kept
    what: Pass 2, claims that say more than the rows they cite.
    moved: Partial claims fell from 76 of 129 over five runs to 26 of 80 over three, with the same conclusions.
  - name: p02-low
    phase: 1
    pass: 2
    what: A probe of the investigator at low effort on the pass 2 files.
  - name: p03
    phase: 1
    pass: 3
    finding: F-03
    result: kept
    what: Pass 3, a hypothesis left open with no support and nothing said.
    moved: An open rival with no support of its own now names the check that would decide it; before, half the runs left it with nothing said.
  - name: frame
    phase: 1
    pass: 3
    what: The guard set's two wrong-cause triggers (eval/framing/), one run each, on the pass 3 files.
  - name: final
    phase: 1
    pass: 3
    what: Two more runs at the second checkpoint on the pass 3 files.
  - name: frame-db-at-time
    phase: 1
    pass: 3
    what: A factual question as the trigger, which became the evidence for F-04.
  - name: p04
    phase: 1
    pass: 4
    finding: F-04
    result: kept
    what: Pass 4, the commander's request argued against but not answered. Two framing triggers and the standard one.
    moved: 'Requests are answered as asked: a stated cause gets a plain no with the reason first, and a requested plan is given in full beside the evidence against it.'
  - name: cli-claude
    phase: between
    pass: 4
    what: Two runs by hand on the first provider, one at each checkpoint, with the opening sweep. Each had four reads refused for a quiet board, which led to plan row P1.
    moved: Each run had four reads refused for a quiet board, which plan row P1 turned into a nudge on the status line.
  - name: p3-sol
    phase: 2
    pass: 6
    what: P3's shakedown on the new opening (the agent's own first reads, pass 5) and the quiet-board nudge (pass 6), on sol at medium.
  - name: p3-luna
    phase: 2
    pass: 6
    what: P3's shakedown on the new opening and the quiet-board nudge, on luna at high (V6).
  - name: p4-sol
    phase: 2
    pass: 6
    what: P4's baseline on sol at medium, five runs at the second checkpoint and two at the first.
    moved: Sol at medium led with the cause in 7 of 7 runs and stays the loop's model. The trigger was on the board in only 1 of 7, the gap pass 7 closed.
  - name: p4-luna
    phase: 2
    pass: 6
    what: P4's baseline on luna at high, five runs at the second checkpoint and two at the first.
    moved: Luna at high led with the cause in 2 of 7 runs, four times with the database instead, at a tenth of sol's cost; it is not picked.
  - name: p07
    phase: 2
    pass: 7
    finding: F-07
    result: kept
    what: Pass 7, the summary naming a link of its account (what set the fault off) that the board did not hold. Three runs at the second checkpoint on sol at medium.
    moved: The trigger is on the board in 5 of 5 runs, against 1 of 7, with the leading cause unchanged; neither wrong-cause trigger steered it.
  - name: p07-guard
    phase: 2
    pass: 7
    what: Pass 7's guard set, the two wrong-cause triggers (eval/framing/), one run each.
  - name: p08
    phase: 2
    pass: 8
    finding: F-09
    result: reverted
    what: Pass 8, the leading statement chaining links that its rows do not each show. Five runs at the second checkpoint on sol at medium (three, then two more, since the first three sat inside the spread).
    moved: The leading statement was judged supported in 1 of 5 runs, short of the target, and an effect came back as an open cause in 3 of 5.
  - name: armA
    phase: between
    pass: 7
    what: Section 13's R1, the no-tools baseline (arm A) at the second checkpoint on sol at medium, three runs, for PLAN 13's "arm C beats arm A" once the scorer lands.
    moved: No run named a cause; each left connection exhaustion open at 0.4 with its origin unknown, and none was steered by a trap in the commander's message.
  - name: e4-1440
    phase: between
    pass: 7
    what: Section 13's R2, the first look of the live carry-forward (row E4). Three runs at the first checkpoint on sol at medium, each the start of a run at the second checkpoint in batch e4-1452.
    moved: Every run led with the gateway at 0.75 to 0.8 and answered the planned checkout rollback first; one kept the database as an open cause beside its symptom.
  - name: e4-1452
    phase: between
    pass: 7
    what: Section 13's R3, the live carry-forward (row E4). One run at the second checkpoint for each run of e4-1440, started from its board (--carry-from), on sol at medium.
    moved: Each kept its first look's leading cause at 0.8, cited 7 to 11 rows dated after 14:40 that its own calls fetched, passed the continuity check, and took 10 or 11 turns against 12 to 14 for a fresh look.
  - name: e5-off
    phase: between
    pass: 7
    what: Section 13's R4, the tags ablation (row E5), tags off. Five runs at the second checkpoint on sol at medium.
    moved: The same leading cause, trigger on the board and 30 calls as with tags on; fewer partial claims than pass 7's runs but not than the two tags-on runs made beside them; slower. The agent never used a tag input on either side.
  - name: e5-on
    phase: between
    pass: 7
    what: Section 13's R4, the tags ablation (row E5), tags on. Two runs at the second checkpoint on sol at medium, which with pass 7's three regression runs (p07) make five a side.
    moved: Both led with the gateway at 0.8 with the trigger on the board, and neither used a tag input.
  - name: z5
    phase: freeze
    pass: 7
    what: Section 15's Z5, the contrarian control (arm K). One run at the second checkpoint on sol at medium, the agent with the development incident's discriminators added to its prompt as rules. Not a run of the agent; a held-out variant must make it fail.
