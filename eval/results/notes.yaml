# What each chart on the published tuning-log page shows, in plain English, read from the ledger at the close of the
# eval loop's phase 2 and the scorer (2026-10-14). `python -m eval.results export` writes them to notes.json for the
# page. Update a reading when new batches change what its chart shows, and change the date in `as_of`.
as_of: 2026-10-14, after pass 8 and the scorer
notes:
  - chart: lead
    reading: >-
      Every run on sol, and on Claude, blamed the payments gateway, which is the right answer. The cheaper model, luna,
      got it right only 2 times in 7. Four times it blamed the database, which is a red herring. That is why we kept sol.
  - chart: trigger
    reading: >-
      Early on, every report also said what set the problem off (the payment provider slowing down). After the pass 4
      prompt change, reports mostly stopped saying it. Pass 7 fixed that, and every run since has said it.
  - chart: partial
    reading: >-
      At first, more than half of each report's claims were only partly backed up by the evidence cited. Pass 2 cut that
      to about a third. It has sat around 40 to 50% since. Pass 7 nudged it up a little because reports now make more
      claims.
  - chart: hyps
    reading: >-
      Reports listed 5 or 6 possible explanations until pass 7. Pass 7 made the agent write each part of the story as
      its own entry, so reports now list about 9. Luna's reports list about 4.
  - chart: cost
    reading: >-
      A run costs about $1.06 on Claude, $0.34 to $0.42 on sol, and 3 to 5 cents on luna. Pass 7 added about 5 cents a
      run on sol, because there is more to write and to check.
  - chart: wall
    reading: >-
      A run takes about 3 to 4 minutes on sol, and a bit under 3 when it thinks less. Luna takes 5 to 8 minutes because
      it thinks at length before every step.
  - chart: turns
    reading: >-
      Sol goes back to the model 11 to 14 times a run, every time, because it runs out of lookups (it is allowed 30)
      before it runs out of turns. Luna and Claude need fewer, because they ask for more lookups at once.
  - chart: boardonly
    reading: >-
      Sol wastes 4 to 6 turns a run just updating its notes, and no prompt change has stopped it. Claude barely does
      this and luna does it less, so it is a habit of the sol model, not something the prompt causes.
  - chart: facts
    reading: >-
      Most runs find 4 of the 5 facts a good report needs. The one they keep missing is that the gateway's database
      connections sit open doing nothing. They quote it from chat instead of from the incident ticket where the same
      evidence was pasted, and only the ticket counts. The no-tools baseline finds 2 of 5.
  - chart: traps
    reading: >-
      Sol and Claude avoid almost every red herring: 222 of 226. Every miss involved the database: three runs left it on
      the list as a possible cause, and one never dealt with it. Luna fell for 4 of 33, and the no-tools baseline for 11 of 15.
  - chart: firstcorrect
    reading: >-
      In phase 1 the agent was handed some starting evidence and found the cause after 13 to 31 lookups. Once it had to
      choose its own first lookups, it took 20 to 29. Pass 7 brought that down to 14 to 22.
  - chart: mechanism
    reading: >-
      Most sol runs explain 3 or 4 of the 4 steps of how the failure works. The step most often left out is that the
      checkout service times out waiting for the gateway. Luna's runs range from none to all four, and the no-tools
      baseline explains none.
