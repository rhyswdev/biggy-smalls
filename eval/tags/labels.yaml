# Hand labels for the tag precision check (docs/decisions/ingestion-decisions.md section 4.6).
#
# 89 units. Each was labelled by hand from its own text and the one-line option meanings, and committed
# before the classifier answered the question it is scored against, so git shows the labels came first.
# The sample is fixed by code: within each kind of unit, a run of units in unit-id order, and a unit id is
# a hash of the text (`smalls tag --sample` prints it).
#
# - `signal` (35): the first 21 units of the log, alert, alert-definition and ticket kinds, labelled before
#   the first `make tag` run; and all 14 metric series, labelled before the candidate experiment that
#   first asked about them.
# - `act` (34): asked as one yes/no question per option, so a unit carries `labels`, every option that
#   applies with the main one first, and `also_acceptable`, readings we would not count as wrong. A stored
#   value outside both is an error. 14 units were labelled before the candidate experiment and 20 before
#   the run that adopted the yes/no form. The 20 units first labelled for the pick-one form are kept in
#   labels-act-pick-one.yaml with the table they produced: they carry one label each, and we had seen
#   answers for them before the form changed.
# - `change_kind` (20): the first units of each kind, labelled before the first `make tag` run.
#
# How we labelled:
# - only the text below, never what we know about the incident: a deploy run is a release even when a
#   later record shows it was the rollback, because nothing in its own text says so;
# - for a pick-one facet, a text that does two things takes the label of what it leads with;
# - the meanings are read as written: a commit that changes application code is not "a new version built
#   or deployed", so it is `other` unless it is the release commit or the release merge itself;
# - `other` is a label like any other: for such a unit the right outcome is no tag.
#
# `unit` is the unit id; `text` is what the classifier is sent, kept here so the labels can be reviewed.
