# Hand labels for the tag precision check (docs/decisions/ingestion-decisions.md section 4.6).
#
# 134 units. Each was labelled by hand from its own text and the one-line option meanings, and committed
# before the classifier answered the question it is scored against, so git shows the labels came first.
# Each sample is a run of units of one kind in unit-id order, and a unit id is a hash of the text.
#
# A unit carries either `label`, one option, or `labels`, every option that applies with the main one first,
# plus `also_acceptable`, readings we would not count as wrong. A unit with one `label` is scored on the
# pick-one question only; a unit with `labels` is scored on every question asked of its kind, and a stored
# value outside `labels` and `also_acceptable` is an error.
#
# - `signal` (80): the first 21 units of the log, alert, alert-definition and ticket kinds, one label each,
#   made before the first `make tag` run; all 14 metric series; and 45 units with `labels`, 17 made before
#   the first candidate experiment and 28 made before `signal` as yes/no was scored. Seven of the 45 carry
#   `seen`: we had come across one of their answers while reading earlier results. The 28 skip the 34
#   largest log templates, whose yes/no answers we had already read.
# - `act` (34): 14 made before the candidate experiment and 20 before the run that adopted the yes/no
#   form. The 20 units first labelled for the pick-one form are in labels-act-pick-one.yaml with the table
#   they produced: they carry one label each, and we had seen answers for them before the form changed.
# - `change_kind` (20): the first units of each kind, made before the first `make tag` run.
#
# How we labelled:
# - only the text below, never what we know about the incident: a deploy run is a release even when a
#   later record shows it was the rollback, because nothing in its own text says so;
# - for one `label`, a text that does two things takes the label of what it leads with;
# - the meanings are read as written: a commit that changes application code is not "a new version built
#   or deployed", so it is `other` unless it is the release commit or the release merge itself;
# - `other` is a label like any other: for such a unit the right outcome is no tag.
#
# `unit` is the unit id; `text` is what the classifier is sent, kept here so the labels can be reviewed.
