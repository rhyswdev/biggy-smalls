# Hand labels for one question: should `signal` also be asked as yes/no per option (open point O6)?
# 28 more units, sharing none with eval/tags/labels.yaml or facets-1.labels.yaml, and none of the 34 largest
# log templates, whose yes/no answers we had already looked at. Within each kind, the next units by unit id.
# Labelled by hand from the text and the option lines, and committed before they were scored.
#
# `labels` is every option that applies, the main one first; `also_acceptable` lists readings we would not
# count as wrong; a stored value outside both is an error.
