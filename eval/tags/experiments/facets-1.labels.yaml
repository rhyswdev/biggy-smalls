# Hand labels for the candidate-facet experiment (facets-1.toml), a second sample that shares no unit with
# eval/tags/labels.yaml: within each kind, the next units by unit id after that sample, plus every metric
# series. Labelled by hand from the text and the option lines in facets-1.toml, and committed before the
# experiment was run.
#
# `labels` is what should be stored: for a yes/no facet, every option that applies, the main one first;
# an empty list means no tag is the right outcome, as does `other`. `also_acceptable` lists readings we
# would not count as wrong; a stored value outside both is an error.
#
# One unit was not labelled blind for `signal`: we had already seen the shipped profile's answer for the
# template "binding parameter" while looking at untagged log volume. It is marked `seen: true`.
