# Tagging configuration. The pinned classifier version lives here and nowhere else (rule T10): code,
# profiles and docs say "the pinned classifier version". Changing the classifier is this one line and a
# `make tag` run. Every value here is config, never a model choice.

[classifier]
version = "jev-1.13.0"
# Vendor list price, used only to print what a `make tag` run cost.
usd_per_million_input_tokens = 0.042

[rules]
# A tag is applied only when its probability is at or above the floor and, for a pick-one question, the
# chosen option is not `other` (rule T2). The floor started at 0.8 and was raised to the value measured on
# the hand-labelled sample: the lowest floor at which no stored value fails to reproduce over the repeats
# and at least 9 in 10 stored values match the label (`smalls tag --report`; the table is in docs/DATA.md).
# The cache keeps raw probabilities, so moving it needs no new calls. A test holds it to the measured one.
floor = 0.90
# A repeat reproduces a stored value when it comes back no more than this far under the floor. The
# classifier rounds to 0.01 and moves by about that between identical requests, so without it the floor
# is set by wobble around the threshold and not by answers that change.
tolerance = 0.02

[run]
concurrency = 8
# Cold repeats over the hand-labelled sample for the stability check; the last one shuffles option order.
repeats = 3
