rationale: >-
  Why you are making this call, written before you see the result: the
  hypothesis it tests and what you expect. The incident commander reads it
  at the gate, and the run record keeps it.
tools:
  list_alerts:
    description: >-
      List alert streams from every alerting source (monitors, APM problems,
      log-search alerts, network-monitor alerts, paging incidents) that fired
      in the window or were active during it. One row per stream: its handle,
      source, native id, title, the entity as the source wrote it, first
      seen, last change, state at now, how many times it changed state, and
      any linked paging incident or saved search. A flapping alert is one row
      with its count, and a duplicate delivery is one row. The stream's later
      records and its definition are listed as handles to fetch with
      get_record; monitors with no state change yet are named in the footer.
      Use a row's handle for that stream's verdict in the report. Up to 40
      rows.
    params:
      since: >-
        Start of the window: an ISO-8601 time with Z or an offset (a bare time
        is UTC), a time relative to now such as -30m, -2h or -1d, or now.
      until: >-
        End of the window, in the same forms as since. Defaults to now, and
        is clamped to now.
      source: >-
        Only streams from this alerting source, by the source name rows
        print. An unknown name is answered with the sources that have
        streams.
      text: >-
        Only streams whose title or body contains this text, ignoring case.
      state: >-
        active: only streams alerting at now. all (default): every stream in
        the window, recovered ones included. Log-search alerts have no state
        and show as fired under both.
      signal: >-
        Tag filter, a search aid and never evidence: only streams a
        classifier tagged with this signal (latency, errors, saturation,
        availability, traffic, change, security, or routine for normal
        operation), or untagged for those with no signal tag. A stream can
        carry several tags or none, and tags are applied only when the
        classifier is confident, so many relevant streams have none. The
        footer counts the streams that match without the filter and the
        untagged ones: look at them before calling anything absent.
  get_record:
    description: >-
      Return one record in full, as it stood at now: every non-empty field,
      nothing clipped, with empty fields counted rather than shown. Values the
      tool derived at now, such as a state or a count, are on lines starting
      "derived at now:", and scheduled times are marked (planned). The
      record's parent and children (an incident's journal entries, a build's
      commits, a thread's replies, a stream's later records) are listed as
      handles. Use it to read in full any row another tool shortened, and to
      make a handle citable that was only listed. A record too large for one
      result comes in parts, and the result says part 1 of n. Counts, metric
      reads and notes are minted per call or per run and cannot be fetched:
      the answer names the call to run again.
    params:
      handle: >-
        The handle exactly as a result printed it.
      part: >-
        Which part of a large record to return, from 1 (the default). The
        first part says how many there are.
  search_logs:
    description: >-
      Search raw logs in a window. Without group_by it returns matching
      records, oldest first, up to limit: the total, then for each its
      handle, UTC time, host, sourcetype and the record's first line as a
      person reads it, with stack traces folded to 3 frames. A row that
      matched only in a field it does not print is marked [matched in the
      full record]; get_record returns the whole record. When the result is
      cut, the newest rows are the ones left out: narrow the window or add
      terms. With group_by it returns a count table with one handle for the
      whole table, including a table of zeros, which is how an absence is
      cited; a table that depends on a tag has no handle. Counts from sampled
      sources are estimates and show their sampling rate. The equivalent
      native search is echoed.
    params:
      terms: >-
        Up to 8 terms; a record must contain every one, as a case-insensitive
        substring anywhere in the full record. Use the words the source would
        write: error text, an id, a component name. Leave out to match every
        record that passes the other filters.
      sourcetype: >-
        Only records of this sourcetype, as the inventory names it. An unknown
        value is answered with those that exist.
      host: >-
        Only records from this host, as the inventory names it. An unknown
        value is answered with those that exist.
      since: >-
        Start of the window: an ISO-8601 time with Z or an offset (a bare time
        is UTC), a time relative to now such as -30m, -2h or -1d, or now.
      until: >-
        End of the window, in the same forms as since. Defaults to now, and
        is clamped to now.
      group_by: >-
        Return counts instead of rows: minute (a count per time bucket, zeros
        included), host, level, template (the 20 most common message
        patterns, with variable parts masked, and an other row), or signal
        (by tag: this table has no handle and cannot be cited).
      bucket: >-
        Bucket width for group_by=minute: 1m (the default) or 5m. A long
        window widens the bucket and says so.
      limit: >-
        Without group_by: how many records to return, 1 to 50, default 30.
      signal: >-
        Tag filter, a search aid and never evidence: only records a
        classifier tagged with this signal (latency, errors, saturation,
        availability, traffic, change, security, or routine for normal
        operation), or untagged for those with no signal tag. A record can
        carry several tags or none, and tags are applied only when the
        classifier is confident, so many relevant records have none. A count
        that uses this filter has no handle. The footer counts the records
        that match without the filter and the untagged ones: look at them
        before calling anything absent.
  query_metrics:
    description: >-
      Read one metric query over a window. Returns up to 4 series, each
      merged to at most 45 points with missing values kept as gaps; for each
      series its minimum, maximum, runs of missing data, and the first point
      past each threshold of any monitor on exactly this query; and one
      handle for the read. A point past a threshold is one value, not the
      monitor firing: list_alerts says when a monitor fired. metric and scope
      must select exactly one query the inventory lists; anything else is
      answered with the queries that exist. Series beyond the first 4 are
      named in the footer with their maxima.
    params:
      metric: >-
        The aggregation and metric name, exactly as the inventory prints
        them.
      scope: >-
        The query's tag filter as the inventory prints it, comma-separated.
        Add a group tag to select a single series.
      since: >-
        Start of the window: an ISO-8601 time with Z or an offset (a bare time
        is UTC), a time relative to now such as -30m, -2h or -1d, or now.
      until: >-
        End of the window, in the same forms as since. Defaults to now, and
        is clamped to now.
      rollup: >-
        How points are merged into buckets: avg, max, min or sum. Defaults to
        the query's own aggregation, and to max for a percentile. A merged
        sum is a total per bucket, not a level.
  list_changes:
    description: >-
      List pipeline builds and change requests whose span overlaps the
      window, ordered by start: handle, kind, id, CI or job, summary,
      version, change ticket, start, end, state at now and requester. A build
      still running shows no result or duration, and a change that has not
      started is marked planned. Builds and change requests are listed side
      by side, never joined or ranked: whether one matters is yours to test,
      and a change near onset is a candidate, not a cause. A build's commits
      are listed as handles. Up to 30 rows.
    params:
      since: >-
        Start of the window: an ISO-8601 time with Z or an offset (a bare time
        is UTC), a time relative to now such as -30m, -2h or -1d, or now.
      until: >-
        End of the window, in the same forms as since; defaults to now. Left
        out, changes planned after now are listed too; given, they are only
        counted.
      text: >-
        Only changes whose title or body contains this text, ignoring case.
      change_kind: >-
        Tag filter, a search aid and never evidence: only changes a
        classifier tagged with this kind (release, rollback, config, infra,
        network, data, job), or untagged for those with no kind tag. Tags are
        applied only when the classifier is confident, so many relevant
        changes have none. The footer counts the changes that match without
        the filter and the untagged ones: look at them before calling
        anything absent.
  itsm_query:
    description: >-
      Query the service desk as it stood at now: incidents, journal entries
      (work notes and comments on incidents), users or groups, newest first.
      Every row prints its number or name, short description and state;
      fields adds others by name. A journal entry longer than 300 characters
      is shortened and marked, and get_record returns it whole. An incident's
      row lists its journal entries as handles. The native query is echoed.
    params:
      table: >-
        Which table: incident, journal, user or group.
      filters: >-
        Up to 6 name and value pairs, all of which must match: a field name
        and its display value, compared without regard to case. Journal
        entries can be filtered by number, the number of their incident. An
        unknown field name is answered with the table's field names.
      text: >-
        Only rows whose title or body contains this text, ignoring case.
      fields: >-
        Up to 12 field names to print beside the defaults. A named field that
        is empty prints (empty).
      limit: >-
        How many rows to return, 1 to 20, default 20.
      signal: >-
        Incidents only. Tag filter, a search aid and never evidence: only
        incidents a classifier tagged with this signal (latency, errors,
        saturation, availability, traffic, change, security, or routine for
        normal operation), or untagged for those with no signal tag. An
        incident can carry several tags or none, and tags are applied only
        when the classifier is confident. The footer counts the incidents
        that match without the filter and the untagged ones: look at them
        before calling anything absent.
  search_knowledge:
    description: >-
      Keyword search over runbooks, knowledge pages, and the close notes and
      work notes of incidents. Returns ranked passages: handle, rank,
      heading, what kind of passage it is, when it was last updated, and its
      text. A passage over 600 characters is shown as a marked snippet, and
      get_record returns the whole record. A closed incident returns its
      whole close note with its CI, category and close code. Ranking is plain
      keyword ranking with any word matching, so read past the first hit. A
      past incident or runbook says where to look, not what happened this
      time.
    params:
      query: >-
        1 to 300 characters. Words are matched one by one, any of them, and
        punctuation is ignored. Use the words a document would contain:
        component names, error text, the symptom.
      k: >-
        How many passages to return, 1 to 5, default 5.
  get_topology:
    description: >-
      Resolve a name to configuration items and walk their relationships.
      For each match: every alias candidate and how it matched (exact, case,
      domain stripped, pod suffix stripped, IP address, external id), the
      owner and whether that owner is active, the support group, operational
      status and external ids. Then edges up to hops away, each with type,
      direction, status and the source that states it: CMDB relationships,
      monitored entities, or service-call tags. A name that matches nothing,
      or more than one item, stays unresolved and is shown as such. Sources
      can disagree, and both are shown. Up to 40 edges, nearest first.
    params:
      entity: >-
        A name as any record writes it: a service, host, pod, IP address, CI
        name or external id.
      hops: >-
        How far to walk: 1 (the default) or 2.
  get_oncall:
    description: >-
      Who is on call at now. For a paging service or escalation policy: its
      escalation levels, who holds each level at now, the escalation timeout,
      and for a service its status derived at now. A level nobody holds is
      named. With neither service nor policy, lists the services and
      policies.
    params:
      service: >-
        A paging service by name, id or handle. Give this or policy, not
        both.
      policy: >-
        An escalation policy by name, id or handle. Give this or service, not
        both.
  read_chat:
    description: >-
      Read chat messages in a window, oldest to newest: handle, UTC time,
      display name, text with mentions resolved, and reply count at now. A
      thread's replies are listed as pointers on its first message, with the
      thread_ts that shows them. Messages are never shortened; when the
      result is cut, the oldest messages are the ones left out. Up to 60
      messages. Chat says what people saw, did and suspected: a lead to test,
      never a causal link on its own. Times people mention are recollections;
      the message's own time is the machine's.
    params:
      channel: >-
        One channel by name, with or without #. Left out, every channel is
        read.
      since: >-
        Start of the window: an ISO-8601 time with Z or an offset (a bare time
        is UTC), a time relative to now such as -30m, -2h or -1d, or now.
      until: >-
        End of the window, in the same forms as since. Defaults to now, and
        is clamped to now.
      text: >-
        Only messages that contain this text, ignoring case. Replies are
        matched too, each as its own row.
      thread_ts: >-
        The ts of a thread's first message, as printed: returns that thread's
        replies.
      act: >-
        Tag filter, a search aid and never evidence: only messages a
        classifier tagged with this act (observation, hypothesis,
        action_taken, action_proposed, question, status, social, or automated
        for posts by bots and integrations), or untagged for those with no
        act tag. A message can carry several tags or none, and tags are
        applied only when the classifier is confident, so many relevant
        messages have none. The footer counts the messages that match without
        the filter and the untagged ones: look at them before calling
        anything absent.
  check_status_page:
    description: >-
      Read an external provider's public status page as last published
      before now: its overall indicator, the components that are not
      operational with a count of those that are, incidents with their
      updates newest first, and scheduled maintenance. Long updates are
      shortened and marked, and get_record on the snapshot returns the whole
      page. With no provider, lists the known pages, which become citable
      once read. A status page is the provider's own account and often lags
      its problems, so an all-clear is weak evidence of health.
    params:
      provider: >-
        The provider's name or the page's name, ignoring case. Leave out to
        list the pages.
  propose_action:
    description: >-
      Propose an operational step to the incident commander. Nothing is run:
      the proposal is recorded and put to a person, who approves it, rejects
      it with a reason, or defers it, and the report lists it with that
      decision. Propose a step when the evidence supports it and someone
      should decide on it now. Cite only rows a tool has shown: a proposal
      citing anything else is refused before anyone sees it. Say in
      rationale.expect what the step should change.
    params:
      kind: >-
        The kind of step, from the closed list below; give the specifics in
        target and params. Each line says when the kind fits and what it
        costs.
      target: >-
        What the step acts on, named as the records name it: a service, host,
        change, flag, provider, alert stream or team.
      params: >-
        The specifics as name and value pairs, such as the version to return
        to, a setting and its new value, or a duration.
      evidence: >-
        Handles of shown rows that justify the step.
  update_board:
    description: >-
      Record what you now believe. Free and never gated: use it at the start
      and whenever evidence moves a hypothesis. Hypotheses merge by id: give
      only the fields that change, and a list you give replaces that list, so
      write it as it should now stand. A new id creates a hypothesis and must
      carry statement, role, status, subject, confidence and source; role and
      source cannot change afterwards. Timeline rows and open questions are
      added to the board's. Every handle must have been shown in this run. A
      write that breaks a rule is refused with the reason, and the result
      ends with the board's status line.
    params:
      hypotheses: >-
        Hypotheses to create or update, by id.
      timeline: >-
        Events to add to the board's timeline.
      open_questions: >-
        Questions to add to the board's list.
  submit_report:
    description: >-
      Submit the investigation's report. It ends the investigation, so it
      must be the only call in its turn. Code checks it: every handle shown
      in this run; every hypothesis, timeline row, action and do-not item
      citing at least one handle; the leading hypothesis supported by a row
      that is not chat; every rejected hypothesis with rows against it; a
      report with no leading hypothesis carrying an open question. A report
      that fails comes back once with what to fix. It may then come back once
      from review, as this call's result, with claims to correct or a check
      to run.
    params:
      summary: >-
        First, the plain answer to what the trigger asks, even when your
        recommendation differs; then what is happening, what most likely
        caused it and how sure you are, in a few sentences, with handles
        inline exactly as printed. It tells the board's account in prose:
        each link it rests on, such as what set the fault off or made it
        worse, is a hypothesis on the board with that role and its rows.
      impact: >-
        Who and what is affected and who owns it, from the service desk,
        topology and on-call records.
      hypotheses: >-
        A last update to the board, applied before the report is read from
        it: ids the board holds, each with only the fields that change, or an
        empty list if the board already stands as it should. If submit_report
        is your only tool, give each hypothesis in full here.
      timeline: >-
        The incident's key events in time order, written in full: the
        report's timeline is this list.
      actions: >-
        Your ranked recommendation, written in full, whether or not each step
        was proposed: stop the harm first, then confirm, then fix.
      do_not: >-
        Steps someone might reasonably take that the evidence says would do
        harm or waste time.
      alerts: >-
        A verdict for every alert stream your list_alerts calls showed, and for
        any other stream you assessed, by the stream row's handle.
      open_questions: >-
        What is still unknown, written in full, each a question a person or a
        call could answer.
      stakeholder_update: >-
        An update for people outside the response, in plain words and without
        handles. State only what is confirmed.
  submit_verdict:
    description: >-
      Return your review of the report. Call it once, as your only call.
    params:
      claims: >-
        One verdict for each claim id in the packets. Leave empty in the
        contrarian pass.
      alternatives: >-
        Up to three alternative explanations the evidence fits, strongest
        first. Leave empty in the claim-support pass.
      ignored: >-
        Handles of shown rows that cut against the leading hypothesis or
        support an alternative, and that the report does not address. Leave
        empty in the claim-support pass.
      overall: >-
        revise if the report should go back to the investigator under your
        pass's rule, otherwise pass. Code applies the rule itself.
objects:
  Rationale:
    tests: >-
      The hypothesis this call tests, by id, and its claim in a few words; or
      the open question it answers.
    expect: >-
      What the result should show if the claim holds, and what would count
      against it. For an action, what should change if it works.
  Pair:
    name: >-
      A field, setting or argument name.
    value: >-
      Its value as text. A value that is not text, such as a number or a
      list, as its JSON text.
  HypothesisFields:
    id: >-
      A short, stable id such as h1, kept across updates and later looks, and
      never reused for a different claim.
    statement: >-
      The claim in one sentence: what the subject did and what it led to.
    role: >-
      What the claim says the subject is in this incident, fixed when the
      hypothesis is created: cause (its fault is why the incident happens),
      trigger (the event that set the cause off), contributing (made it
      worse, wider or longer), symptom (an effect, not the origin) or
      unrelated (happening, but not part of this incident).
    status: >-
      Whether the claim stands: leading (the one explanation you would act on
      now; at most one), open (not yet decided, or supported but not the
      lead; by the report, one with no support of its own is named in an
      open question that says what would decide it) or rejected (cleared by
      evidence, which goes in against).
    subject: >-
      The one entity the claim is about, and for a cause the one it blames,
      named as the records name it. A change goes in changes, not here.
    entities: >-
      Every entity the claim touches, named as the records name them.
    changes: >-
      Handles of the change or build records the claim implicates.
    confidence: >-
      0 to 1, by the rubric: 0.2 stated or chat evidence only; 0.4 machine
      evidence fits; 0.6 a discriminating check passed and time order holds;
      0.8 independent sources agree and the rivals have rows against them.
      Clamped to 0.5 without support that is not chat.
    support: >-
      Handles of shown rows that support the claim, as the list should now
      stand. By the report, it should hold a row for each link the statement
      names, the effect included, and the discriminating rows, which the
      report does not carry.
    against: >-
      Handles of shown rows that cut against the claim, as the list should
      now stand. A rejected hypothesis needs at least one.
  HypothesisUpdate:
    source: >-
      stated if someone put the claim forward (in the trigger, chat, a ticket
      or a note); derived if you formed it from the evidence. Fixed when the
      hypothesis is created.
    because: >-
      Handles of the rows that moved the hypothesis in this update.
    discriminating: >-
      Handles of shown rows, not chat, that would exist only if the claim
      were true: the checks it has passed.
  TimelineRow:
    t_utc: >-
      When it happened, as an ISO-8601 UTC time taken from the machine
      record.
    event: >-
      One event, in one line.
    evidence: >-
      Handles of the rows that show it, and of any other event or record the
      line mentions.
  Impact:
    business_service: >-
      The business service affected, as the service desk or CMDB names it.
    cis: >-
      The configuration items affected, as the CMDB names them.
    priority: >-
      The priority you suggest, with the impact and urgency behind it.
    assignment_group: >-
      The group that should own the incident, as the service desk names it.
    oncall: >-
      Who is on call for that service or group now, from the on-call
      records; unknown if you did not look it up.
    customer: >-
      The effect on customers as the evidence shows it, and for whom where a
      record says.
  Priority:
    suggested: >-
      The priority you suggest from impact and urgency, on the scale the
      service desk's own incidents use.
    impact: >-
      How widely the business is affected, on the desk's scale, with the
      reason in a few words.
    urgency: >-
      How quickly it must be resolved, on the desk's scale, with the reason
      in a few words.
  Action:
    rank: >-
      The order to do it in, from 1.
    action: >-
      One concrete step, naming what it acts on.
    owner: >-
      Who should do it, as the records name them: an assignment group, a
      team, or the person on call.
    evidence: >-
      Handles of the rows that show the problem it addresses on the target it
      names, and any other fact it states.
  DoNot:
    action: >-
      The step not to take now.
    why: >-
      Why it would do harm or not help, from facts its rows show; a
      consequence drawn from them is worded as reasoning.
    evidence: >-
      Handles of the rows that show it.
  AlertVerdict:
    handle: >-
      The alert stream's handle, as its list_alerts row printed it.
    verdict: >-
      this_incident: part of this incident, as cause or symptom.
      other_incident: a real problem, but a separate one. noise: no real
      problem behind it, such as a routine check, a test or a known false
      alarm.
  StakeholderUpdate:
    status: >-
      Where the incident stands (investigating, identified, monitoring or
      resolved) and what that means now, in one line.
    customer_impact: >-
      What customers notice, in their terms, and since when.
    scope: >-
      Who and what is affected, and what is not.
    changed_since_last: >-
      What is new since the last update; on a first update, say that it is
      the first.
    next_steps: >-
      What the responders are doing next.
    next_update_at: >-
      When the next update will go out, as a UTC time after now; commonly 30
      minutes ahead while customers are affected.
  ClaimVerdict:
    id: >-
      The claim's id, as the packet gives it.
    verdict: >-
      supported: the cited rows show it. partial: they show part of it, and
      the rest is inference or missing. unsupported: they do not show it.
      contradicted: a row shows the opposite.
    quote: >-
      The shortest exact text from a row that decides the verdict. For
      unsupported, the words of the claim that no row carries.
    handle: >-
      The handle of the row the quote comes from; left out when the quote is
      from the claim.
  Alternative:
    statement: >-
      The alternative explanation as one claim, then what the check would
      show if it were true.
    fit: >-
      equal: the rows shown fit it as well as the leading hypothesis. weaker:
      it fits, but some row favours the leading hypothesis.
    check: >-
      One read call whose result would tell this alternative from the
      leading hypothesis.
  Check:
    tool: >-
      The read tool's name, as the review prompt lists it.
    args: >-
      Its arguments as name and value pairs, without rationale or tag inputs.
      A value that is not text, as its JSON text.
action_kinds:
  halt_change: >-
    Pause or stop a rollout, deployment or scheduled change that has not
    finished, and hold further changes to the affected components. Fits when
    a change is in progress or due during the incident. Cheap and reversible;
    it stops things getting worse but repairs nothing already broken.
  rollback_change: >-
    Return a component to its last known good version or configuration by
    reverting a change. Fits when a change came before onset on the affected
    component and evidence ties the symptom to it. Often the fastest safe
    mitigation; name the version to return to, and check the change can be
    reversed, since some, such as data migrations, cannot.
  toggle_feature_flag: >-
    Turn a feature flag off or on. Fits when evidence implicates a feature
    behind a flag. Usually the quickest and most reversible mitigation; name
    the flag and the state to set.
  failover: >-
    Move traffic or the primary role to a standby, replica, zone or alternate
    provider. Fits when one instance, zone or provider is failing and a
    healthy alternative exists. Disruptive and sometimes hard to undo;
    confirm the target is healthy and current first.
  isolate_component: >-
    Take one instance, host, node or route out of rotation, keeping it for
    inspection. Fits when part of a fleet misbehaves and the rest is healthy.
    Reduces capacity, and keeps the evidence.
  shed_load: >-
    Throttle, rate-limit, queue or drop lower-priority traffic or work to
    protect the core path. Fits when overload is the problem or is making it
    worse, as with a surge or a retry storm. Deliberately degrades some users
    to protect the rest; say whom.
  block_source: >-
    Block or rate-limit one client, address, token or caller. Fits when a
    single source sends abusive, malformed or runaway traffic. May block a
    legitimate customer; cite the rows that identify the source.
  stop_workload: >-
    Stop or pause a job, batch, consumer, query or session that is consuming
    shared resources. Fits when one workload is starving others. Its work
    must later be resumed or redone; check that it is safe to interrupt.
  scale_capacity: >-
    Add instances, resources or headroom to a component. Fits when demand
    exceeds capacity while each request still behaves normally. Does not fix
    a defect, and scaling a component that fails for another reason can push
    more load onto a struggling dependency.
  restart_service: >-
    Restart a process, service or its instances. Fits when a component is
    stuck in a bad state that a fresh start clears, and the cause is not
    upstream of it. Brief disruption; the symptom returns if the cause lies
    elsewhere, and a restart destroys in-memory evidence, so collect
    diagnostics first when the cause is unclear.
  change_config: >-
    Change one runtime setting, such as a limit, timeout, size or threshold,
    without a deploy. Fits when evidence points at a specific setting. Name
    the setting, its current value and the new one; an untested setting
    change is itself a change during an incident.
  clear_cache: >-
    Clear or invalidate a cache that holds bad or stale data. Fits when wrong
    data is being served from a cache. Can send a surge of load to the
    system behind the cache, so stage it where possible.
  renew_credential: >-
    Renew, rotate or reissue a certificate, secret, key or token that has
    expired or been revoked. Fits when authentication or TLS failures begin
    at an expiry or rotation time. Every consumer of the credential must pick
    up the new one.
  restore_data: >-
    Restore or repair data from a backup, a replica or a known good state.
    Fits when data was lost or corrupted. Slow, may lose recent writes, and
    needs the data owner's approval.
  deploy_fix: >-
    Ship a corrective change forward instead of reverting. Fits only when a
    rollback is impossible or worse and the fix is small and understood.
    Slower and riskier than a rollback, because it adds a new change to the
    incident.
  collect_diagnostics: >-
    Capture evidence that would otherwise be lost, such as thread or heap
    dumps, process state, verbose logs or packet captures, before a restart
    or failover. Fits when the cause is unclear and a disruptive mitigation
    is about to destroy the evidence. Usually cheap; may pause a process
    briefly.
  run_runbook_step: >-
    Carry out a named step from a runbook or knowledge article. Fits when a
    documented procedure matches this incident's evidence, not just its
    symptoms. Cite the runbook's handle and name the step.
  page_responder: >-
    Page or escalate to a person or team. Fits when the owner of the
    implicated component, a needed specialist or a decision-maker is not yet
    engaged. Name whom, as the on-call or service desk records name them,
    and why now.
  contact_provider: >-
    Open or escalate a case with an external provider. Fits when evidence
    implicates a third-party service or its status page reports a problem.
    Providers answer slowly, so start early and keep mitigating internally
    in parallel.
  update_incident_record: >-
    Change the incident record: its priority, assignment group, affected CIs,
    or a work note. Fits when the record no longer matches the evidence.
    Cheap, and keeps routing and reporting right.
  post_status_update: >-
    Publish an update to stakeholders or the status page. Fits when
    customers or internal stakeholders are affected and the last update is
    missing, stale or wrong. State only what is confirmed.
  silence_alert: >-
    Mute an alert stream for a fixed time. Fits only for a stream judged
    noise or already handled, to cut distraction. Never for a stream tied to
    this incident; always give an expiry.
