# The agent's configuration. This is the only file in which a model name may appear: code, prompts and
# docs name a model by its role. Models are chosen per role by a named set (docs/decisions/eval-loop.md, V5):
# --set or SMALLS_SET picks the set, --role role=profile[@effort] or SMALLS_ROLES overrides one role, and
# --effort or SMALLS_EFFORT the investigator's effort; --profile or SMALLS_PROFILE still names the
# investigator's profile, and SMALLS_MODEL overrides its model. Under pytest every role is the scripted
# model unless SMALLS_LIVE=1, so a test never goes live because a key happens to be set.

default_set = "sol"
default_profile = "anthropic"   # read only by a config that has no [sets]

# Budgets. Starting values, to be re-set after the first measured run.
call_budget = 30            # gated tool calls (reads and actions) per run
revision_calls = 5          # extra calls after a verifier asks for a revision
extra_turns = 6             # model turns allowed beyond the call budget, because internal calls are free
stale_rounds = 3            # rounds with no board change before the status line nudges the model; nothing is refused
stuck_empty = 3             # consecutive empty reads before the stuck hint
malformed_shown = 3         # rounds in a row with a call whose arguments fail validation before those calls are shown;
                            # until then the model is answered with the error and retries, and nobody sees it
context_fraction = 0.85     # restart (or stop) when a call's input reaches this share of the input limit
headless = "defer"          # what an unattended run that is not an eval run answers a gate with
auto_approve = true         # reads run without asking; --interactive turns this off. Actions always ask.
timeout_s = 600             # per model call; set explicitly because the client library's default is none
fallback_profile = ""       # a profile to ask once when the model declines to continue; none by default
cache_ratio_floor = 0.5     # from the second model call, a cached share of the input below this raises an event
heartbeat_s = 10            # with nothing to show for this long, the terminal says the run is still working
runs_dir = "eval/runs"

[sweep]                     # the opening sweep's windows, relative to now
alerts = "-2h"
chat = "-2h"
changes = "-24h"

[verifier]
enabled = true                          # the two passes' models are the `claims` and `contrarian` roles of the set
digest_tokens = 1500                    # the digest of rows that were shown but not cited

# Sets: every role, as `profile` or `profile@effort`; an empty string cuts a verifier pass. Each role's effort
# is fixed for a run, because changing it invalidates the prompt cache.
[sets.sol]                              # the eval loop's set (V2, V4): one model, effort by role
investigator = "openai@medium"
contrarian = "openai@medium"            # the contrarian pass needs the strongest reading: the investigator's
claims = "openai@low"                   # claim support is short reading of packets
overfit = "openai@medium"               # reads diffs against the answer
drafter = "anthropic-mid"               # the UI's message drafter (U8), not part of the investigation

[sets.claude]                           # the first provider: the loop's retest (L7) and later benchmarks
investigator = "anthropic@medium"
contrarian = "anthropic@medium"
claims = "anthropic-small@medium"
overfit = "anthropic@medium"
drafter = "anthropic-mid"

[profiles.scripted]         # keyless and deterministic; proves the plumbing, not the model
provider = "scripted"
model = "scripted"

[profiles.anthropic]        # the investigator
provider = "anthropic"
model = "claude-opus-5-5"
max_tokens = 32000
max_input_tokens = 1000000
effort = "medium"           # fixed for the run: changing it invalidates the prompt cache
thinking = { type = "adaptive", display = "summarized" }
cache = true
strict_tools = false        # the provider refuses strict mode past 24 optional inputs across all tools, and ours have 38 (row C3); our own validation checks every call
# A request the provider declines is re-run by the provider on its own fallback, inside the same call.
betas = ["server-side-fallback-2026-07-01"]
model_kwargs = { fallbacks = "default" }

[profiles.anthropic-small]
provider = "anthropic"
model = "claude-haiku-5-5"
max_tokens = 16000
max_input_tokens = 1000000
effort = "medium"
thinking = { type = "adaptive", display = "summarized" }
cache = true

[profiles.anthropic-mid]    # the stakeholder-message drafter (the UI's ruling U8): prose people send, a step above the cheaper tier
provider = "anthropic"
model = "claude-sonnet-5-5"
max_tokens = 8000
max_input_tokens = 1000000
effort = "low"              # a short message from a given packet; little to reason about
thinking = { type = "adaptive" }
cache = false               # one call per audience, run side by side, so no prefix is read back
betas = ["server-side-fallback-2026-07-01"]
model_kwargs = { fallbacks = "default" }

[profiles.openai]           # the second provider's strong tier at its middle price (V4)
provider = "openai"
model = "gpt-6.1-sol"
reasoning = { effort = "medium", summary = "auto" }
use_responses_api = true
max_input_tokens = 260000   # under the 272k-token threshold where its input rate doubles, so the restart guard fires first
cache = true                # it caches by prefix on its own; this adds a stable cache key per profile
strict_tools = true
store = false               # the history carries the reasoning, encrypted, so nothing is kept by the provider
include = ["reasoning.encrypted_content"]

# USD per million tokens, for run records. A 5-minute cache write costs 1.25 times the input rate and a
# 1-hour write twice it. Rates as cached from the provider's reference on 2026-10-06.
# The second provider caches by prefix on its own and reports what it writes; a write costs 1.25 times the
# input rate, with no separate longer lifetime. Its rates above 272k input tokens per call are higher;
# max_input_tokens keeps calls under them. From its price page on 2026-10-14.
[pricing."gpt-6.1-sol"]
input = 2.00
output = 10.00
cache_read = 0.10
cache_write = 2.50
cache_write_1h = 2.50

[pricing."claude-opus-5-5"]
input = 4.00
output = 20.00
cache_read = 0.20
cache_write = 5.00
cache_write_1h = 8.00

[pricing."claude-sonnet-5-5"]   # from the provider's price page on 2026-10-14; its cache reads are 0.05 times the input rate
input = 2.00
output = 10.00
cache_read = 0.10
cache_write = 2.50
cache_write_1h = 4.00

[pricing."claude-haiku-5-5"]    # for prompts up to 100K tokens; a claim-support packet is far smaller
input = 0.10
output = 0.50
cache_read = 0.01
cache_write = 0.125
cache_write_1h = 0.20

[pricing.scripted]
input = 0.0
output = 0.0
cache_read = 0.0
cache_write = 0.0
cache_write_1h = 0.0
