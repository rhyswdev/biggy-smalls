[project]
name = "smalls-agent-spike"
version = "0.0.1"
description = "Throwaway spike: proves the LangGraph framework for the Smalls investigator (gates, streaming, checkpoints, run records)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-sqlite>=3.1,<3.2",
    "langchain>=1.4,<1.5",
    "langchain-core>=1.6,<1.7",
    "langchain-anthropic>=1.7,<1.8",
    "pydantic>=2.7",
    "rich>=13",
    "smalls",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.7,<1.8"]

[dependency-groups]
dev = ["pytest>=8.2"]

[tool.uv]
package = false

[tool.uv.sources]
smalls = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
