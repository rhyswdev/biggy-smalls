# Spike configuration. Model names live here or in the environment, never in code or docs.
# Pick a profile with --profile or SMALLS_PROFILE. Override the model with SMALLS_MODEL.

[run]
auto_approve = true          # global flag; --interactive turns it off
gate_actions_always = true   # proposal for Rhys: action tools gate even when auto_approve is on
tool_call_budget = 12
runs_dir = "runs"

[profiles.scripted]          # keyless and deterministic; proves the framework, not the model
provider = "scripted"
model = "scripted"

[profiles.anthropic]
provider = "anthropic"
model = "claude-opus-5-5"
max_tokens = 32000
effort = "medium"
thinking = { type = "adaptive", display = "summarized" }
cache = true                 # top-level automatic prompt caching

[profiles.openai]
provider = "openai"
model = ""                   # set SMALLS_MODEL; untested here (no key)
reasoning = { effort = "medium", summary = "auto" }
use_responses_api = true

# USD per million tokens, for run records. Anthropic rates from the claude-api reference (cached 2026-10-06).
[pricing."claude-opus-5-5"]
input = 4.00
output = 20.00
cache_read = 0.20
cache_write = 5.00

[pricing.scripted]
input = 0.0
output = 0.0
cache_read = 0.0
cache_write = 0.0
