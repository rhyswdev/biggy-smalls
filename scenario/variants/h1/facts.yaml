# Fixed parameters, docs/PLAN.md section 1.2. Every number a bundle shows derives from these and the
# connection budget in the scenario YAML.
parameters:
  pay_db:
    engine: PostgreSQL 15
    max_connections: 200
    superuser_reserved_connections: 3
    usable_by_app_roles: 197
    log_connections: "on"
    log_line_prefix: "%m [%p] %u@%d "
    databases: [payments, orders]
  payments_gateway:
    vms: [pay-01, pay-02, pay-03, pay-04]
    hikari: {version: 5.1.0, pool_name: HikariPool-1, minimumIdle: 5, maximumPoolSize: 35, connectionTimeout: 5000, idleTimeout: 600000, leakDetectionThreshold: 30000, maxLifetime: 1800000}
    idle_baseline_total: 24
    spring_boot: "3.3.4"
    hibernate: "6.5.3.Final"
    java: "17.0.12"
    db_user: pgw_app
    application_name: payments-gateway
    hikari_logger_level: DEBUG
    versions:
      "3.7.9": {psp_timeout_ms: 3000, psp_retries: 0, backoff_ms: []}
      "3.8.0": {psp_timeout_ms: 8000, psp_retries: 3, backoff_ms: [1000, 2000, 4000]}
    retry_path_hold_s: 39          # 8+1+8+2+8+4+8
    startup: {started_in_s: 41.213, process_running_s: 43.07}
  order_service: {instances: [ord-01, ord-02], pool_fixed: 10, total: 20, db_user: orders_app, application_name: order-service}
  payments_reconciler: {connections: 40, db_user: recon_app, application_name: payments-reconciler, start: "14:30:00", end: "15:15:30"}
  monitoring: {datadog_user: datadog, datadog_connections: 1, datadog_role: pg_monitor, dba_user: postgres}
  authorization_rate_per_s: 14
  paycore: {eu_share: 0.25, fast_call_ms: 400, slow_attempt_s: [9, 12], host: api.paycore.example}
  hold_time_model:
    before_s: "0.75 x 0.4 + 0.25 x 3 = 1.05"
    with_slow_share_p: "1.05 + 36p"
  checkout_api:
    pods: 6
    hikari_pool: 40
    # The pool to checkout-db (HikariCP defaults but size and timeout): fixed at 40 per pod since the March
    # incident, so 240 across six pods against checkout-db's max_connections of 400.
    checkout_db_pool: {pool_name: HikariPool-1, maximumPoolSize: 40, minimumIdle: 40, connectionTimeout: 5000}
    checkout_db: {engine: PostgreSQL 15, max_connections: 400}
    # 2.14.3's logging bump adds a synchronous audit appender: three audit events per submit, written inside the
    # submit transaction to the shared log sink; the client warns when a write takes over 2000 ms.
    audit: {events_per_submit: 3, warn_over_ms: 2000}
    gateway_client_timeout_ms: 10000
    gateway_url: "https://payments-gw.prod.larkspur.internal:8443/v1/authorize"
    namespace: commerce
    versions: {before: "2.14.2", rollout: "2.14.3"}
  traffic_baseline_per_s:
    "GET /api/cart": 30
    "GET /api/checkout/summary": 20
    "POST /api/checkout/address": 10
    "POST /api/checkout/submit": 14
    storefront_browse: 400
  payment_success_rate: {baseline: 98.5, after_rollback: 73.0}
