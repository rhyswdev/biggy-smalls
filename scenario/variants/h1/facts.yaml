# Facts for held-out variant h1 (eval/heldout/cards/h1.md): the Larkspur estate's facts, copied from
# scenario/facts.yaml unchanged except the bundle name and checkout-api's pool to checkout-db under
# `parameters` (the card's "checkout-db CI and pool budget"; the CI itself is in the CMDB content).
# Held out: never read by a session that writes or edits the agent (eval/heldout/README.md).
#
# Aliases: for each entity, the exact strings each source uses for it (case-sensitive). The lint checks
# every alias appears at least once in the bundle and that no alias appears in a source whose list does
# not include it (longest match wins, so "pay-03" inside "pay-03.larkspur.internal" counts as the FQDN).
# Source keys are the top-level bundle folders, plus `triggers`.

company: Larkspur Retail
bundle: h1
date: "2026-10-13"

anchors:
  t0_utc: "2026-10-13T14:00:00Z"
  t0_epoch: 1791900000            # 2026-10-13T14:00:00Z
  day_start_utc: "2026-10-13T00:00:00Z"
  # Offsets on the day, used to render local clocks. The generator derives them from the IANA zone and
  # the lint re-derives every rendered local time to UTC (invariant 8).
  offsets_on_day: {America/New_York: "-04:00", Europe/London: "+01:00", Europe/Rome: "+02:00", America/Los_Angeles: "-07:00", UTC: "+00:00"}

# How each source writes time. `zone` is a property of the integration, not of the data. The generator
# renders `zone`, `format` and `marker` (not `note`) into the served bundle's integration.yaml, which is
# the only place ingestion learns a source's clock.
zones:
  # `format` is a Python strptime pattern that parses the source's time field as served; sources whose
  # times are epochs or need a step first carry `format_note` instead (engineer M5).
  splunk/raw/payments_app: {zone: UTC, format: "%Y-%m-%d %H:%M:%S,%f", marker: none, note: "logback custom pattern, server clock UTC, no offset"}
  splunk/raw/checkout_api: {zone: UTC, format: "%Y-%m-%dT%H:%M:%S.%fZ", marker: Z}
  splunk/raw/postgres: {zone: UTC, format: "%Y-%m-%d %H:%M:%S.%f UTC", marker: "UTC suffix"}
  splunk/raw/nginx: {zone: UTC, format: "[%d/%b/%Y:%H:%M:%S %z]", marker: "+0000"}
  splunk/raw/f5: {zone: UTC, format: "%b %d %H:%M:%S", marker: none, note: "BSD syslog, no year: take syslog_year"}
  splunk/raw/k8s_events: {zone: UTC, format: "%Y-%m-%dT%H:%M:%SZ", marker: Z}
  splunk/alerts: {zone: UTC, format_note: "_time is epoch seconds as a string with milliseconds; the sid's _at_<epoch>_ is the trigger time", marker: epoch}
  datadog: {zone: UTC, format_note: "epoch seconds (events), epoch milliseconds (metric points); monitors ISO-8601 with offset", marker: epoch}
  dynatrace: {zone: UTC, format_note: "epoch milliseconds", marker: epoch}
  servicenow: {zone: America/New_York, format: "%Y-%m-%d %H:%M:%S", marker: none, note: "sysparm_display_value=true, integration user's zone"}
  pagerduty: {zone: UTC, format: "%Y-%m-%dT%H:%M:%SZ", marker: Z}
  jenkins: {zone: UTC, format_note: "epoch milliseconds; changeSet item dates %Y-%m-%d %H:%M:%S %z", marker: epoch}
  slack: {zone: UTC, format_note: "ts = epoch seconds with a 6-digit sequence", marker: epoch, note: "humans write local times in text; users.json carries tz"}
  confluence: {zone: none, format_note: "Last updated <d Mon YYYY> (date only)", marker: none}
  solarwinds: {zone: America/New_York, format_note: "%Y-%m-%dT%H:%M:%S with a seven-digit fraction; keep six digits, then %f", marker: none, note: "Orion server local time"}
  paycore: {zone: America/Los_Angeles, format: "%Y-%m-%dT%H:%M:%S.%f%z", marker: offset}

