datadog:
  events_export_from: "2026-10-12T18:00:00Z"
  monitors:
    - {id: 7391240, key: p90_gw, name: "p90 latency high on payments-gw", type: query alert, paging: "@pagerduty-Payments-Prod",
       query: "max(last_5m):p90:trace.http.request.duration{service:checkout-api,peer.service:payments-gw,env:prod} > 6",
       # A monitor that never fires today: its definition is the evidence (`definition_sig_id` labels its row).
       thresholds: {critical: 6.0, warning: 4.0}, transitions: [], definition_sig_id: sig.dd_p90_quiet, slice: true}
    - {id: 7391241, key: p99_gw, name: "p99 latency on payments-gw", type: query alert, paging: "@slack-sre-oncall",
       query: "max(last_5m):p99:trace.http.request.duration{service:checkout-api,peer.service:payments-gw,env:prod} > 15",
       thresholds: {critical: 15.0, warning: 8.0}, transitions: [], definition_sig_id: sig.dd_p99_quiet, slice: true}
    - {id: 7391255, key: co_errors, name: "checkout-api error rate > 5%", type: query alert, paging: "@pagerduty-Checkout-Prod",
       query: "sum(last_1m):sum:trace.servlet.request.errors{service:checkout-api,env:prod}.as_count() / sum:trace.servlet.request.hits{service:checkout-api,env:prod}.as_count() * 100 > 5",
       thresholds: {critical: 5.0, warning: 2.0}, evaluation_delay_s: 60,
       # Evaluated over the served series (the generator checks it).
       transitions: [{at: "14:32:00", to: Warn, kind: signal, sig_id: sig.dd_errors_warn}, {at: "14:33:00", to: Alert, kind: signal, sig_id: sig.dd_error_rate},
                     {at: "14:44:00", to: OK, kind: signal}], slice: true}
    - {id: 7301990, key: pg_can_connect, name: "Postgres can_connect on {{host.name}}", type: service check, paging: "@pagerduty-Database-Prod",
       query: "\"postgres.can_connect\".over(\"host:pay-db-01\").by(\"host\",\"db\").last(2).count_by_status()",
       transitions: [], definition_sig_id: sig.dd_can_connect_quiet, slice: true}
    - {id: 7391301, key: co_log_volume, name: "checkout-api log volume anomaly", type: log alert, paging: "@slack-sre-oncall",
       query: "logs(\"service:checkout-api env:prod\").index(\"main\").rollup(\"count\").last(\"10m\") > 18000",
       transitions: [{at: "14:30:40", to: Alert, kind: signal, sig_id: sig.dd_log_volume}, {at: "14:44:50", to: OK, kind: signal}], slice: true}
    - {id: 7390118, key: syn_checkout, name: "[Synthetics] checkout flow", type: synthetics alert, paging: "@pagerduty-Checkout-Prod",
       synthetic: syn-checkout-flow,
       transitions: [{at: "14:35:30", to: Alert, kind: signal, sig_id: sig.dd_synthetic_checkout}, {at: "14:47:10", to: OK, kind: signal}], slice: true}
    - {id: 7288104, key: redis_frag, name: "redis-sessions memory fragmentation high", type: metric alert, paging: "@slack-sre-oncall",
       query: "avg(last_15m):avg:redis.mem.fragmentation_ratio{cluster:redis-sessions} > 1.5",
       thresholds: {critical: 1.5, warning: 1.4}, flap: {every_minutes: 130, alert_for_minutes: 28, last_alert_at: "14:12:00", recovered_at: "14:41:00"},
       kind: trap, sig_id: sig.dd_redis_fires, class: dd.redis_flap, muted_by: {who: sam.ortega, at: "14:14:00"}, slice: true}
    - {id: 7312877, key: node_cpu, name: "CPU saturation on {{host.name}}", type: metric alert, paging: "@slack-sre-oncall",
       query: "avg(last_10m):avg:system.cpu.user{kube_cluster_name:k8s-prod-east} by {host} > 90",
       transitions: [{at: "14:15:00", to: Alert, host: node-east-14, kind: noise, tag: background}, {at: "14:38:00", to: OK, host: node-east-14, kind: noise, tag: background}], slice: true}
    - {id: 7344120, key: search_indexer, name: "search-indexer cron job failed", type: event-v2 alert, paging: "@pagerduty-Platform",
       query: "events(\"source:kubernetes kube_cronjob:search-indexer reason:BackoffLimitExceeded\").rollup(\"count\").last(\"5m\") > 0",
       transitions: [{at: "14:10:05", to: Alert, kind: noise, tag: background}], slice: true}
    - {id: 7266031, key: ord_disk, name: "Disk space low on {{host.name}}", type: metric alert, paging: "@pagerduty-Platform",
       query: "max(last_5m):avg:system.disk.in_use{role:orders} by {host,device} > 0.9",
       transitions: [{at: "13:52:10", to: Alert, host: ord-01, kind: noise, tag: defect}, {at: "13:53:00", to: OK, host: ord-01, kind: noise, tag: defect}], slice: true}
    - {id: 7390233, key: syn_marketing, name: "[Synthetics] marketing site homepage", type: synthetics alert, paging: "@slack-web-platform",
       synthetic: syn-marketing-home,
       transitions: [{at: "14:40:00", to: Alert, kind: trap, sig_id: sig.marketing_synthetic}, {at: "15:02:30", to: OK, kind: trap}], slice: true}
    - {id: 7391260, key: success_rate, name: "Payment authorization success rate low", type: query alert, paging: "@slack-payments",
       query: "avg(last_5m):avg:payments.authorize.success_rate{env:prod} < 95",
       thresholds: {critical: 95.0, warning: 97.0}, transitions: [], definition_sig_id: sig.dd_success_quiet, slice: true}
