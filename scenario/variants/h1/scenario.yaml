# Held-out variant h1 (eval/heldout/cards/h1.md): same day, same estate, the visible deploy is guilty.
# Held out: never read by a session that writes or edits the agent, its tools, the scorer or the judge prompt
# (eval/heldout/README.md). The single source of every timestamp, count and number in bundles/h1/.
#
# Built from scenario/larkspur-checkout.yaml: everything the card keeps is carried over unchanged; what the
# card removes is gone; what it adds is here. Times are UTC clock times on 2026-10-13 unless a full ISO date.
# `kind` is signal | trap | noise; every noise item has a `tag`. Content bodies come from
# scenario/variants/h1/content/ where this variant has its own, otherwise from scenario/content/.
#
# The truth (the card): PayCore stays fast all afternoon. checkout-api 2.14.3 (Jenkins #897, CHG0031902) bumped
# the logging library; its new audit appender writes three audit events per submit inside the submit
# transaction, to the log sink the DEBUG flood (from 14:28:40) saturates. Each write then blocks about 9.8 s, so
# a submit holds its checkout-db connection about 30 s, and by Little's law the pool (40 per pod) serves about
# 1.3 submits a second per pod against 2.3 arriving: the rest time out waiting for a connection (5000 ms) and
# answer 504. 2.14.2 pods are clean until they are replaced. payments-gateway, pay-db-01 and PayCore are
# healthy. The rollback at 14:40:30 (#898) clears it by 14:43.

meta:
  bundle: h1
  served_name: larkspur-checkout-2026-10-13   # integration.yaml names the estate's bundle, not the variant
  facts: facts.yaml
  content: content
  date: "2026-10-13"
  seed: 20261013
  t0: "14:00:00"            # epoch 1791900000

checkpoints:
  - {id: "1440", at: "14:40:00", core: true}

# Tokens that must not be visible before 14:40 (lint invariant 7): the rollback and its outcome.
future_tokens:
  "1440": ["#898", "rollback done", "rolled back to 2.14.2", "back to baseline"]

# ---------------------------------------------------------------------------------------------
# Size budget. Targets are this variant's own rendered sizes (a healthy gateway and database log far less
# than the development incident's); ceilings are the development bundle's.
budget:
  ceilings: {log_lines: 5000, structured_records: 250, vendor_sources: 11}
  log_line_targets:
    splunk/raw/payments_app: 460
    splunk/raw/checkout_api: 1210
    splunk/raw/postgres: 235
    splunk/raw/nginx: 490
    splunk/raw/k8s_events: 60
  structured_record_target: 195
  counted: [datadog_events, datadog_monitors, datadog_synthetics, splunk_alerts, solarwinds_alerts, dynatrace_problems,
            servicenow_incidents, servicenow_journal, servicenow_audit, servicenow_changes, jenkins_builds,
            cmdb_ci, cmdb_rel_ci, servicenow_users, pagerduty_objects]

# Lint settings that differ from the development bundle's defaults (smalls_data/lint.py).
lint:
  connection_totals: {"14:29": 45, "14:30": 85, "14:31": 85, "14:32": 85, "14:33": 85}
  pinned_strings: [hikari.timeout, hikari.after_cleanup]     # the vendor strings this bundle renders
  pinned_corpus: ["*.log", "*.jsonl"]                         # checkout-api's pool timeouts are JSON lines

# ---------------------------------------------------------------------------------------------
# Log windows and sampling: the development bundle's, except checkout-api's, which samples the request errors
# per cart (as it samples gateway failures) and the audit client's warnings one line in N.
log_windows:
  payments_app: [["10:15:00", "10:30:00"], ["13:45:00", "15:30:00"]]
  checkout_api: [["13:45:00", "15:30:00"]]
  postgres: [["13:45:00", "15:30:00"]]
  nginx: [["13:45:00", "15:30:00"]]
  f5: [["14:30:00", "15:10:00"]]
  k8s_events: [["13:45:00", "15:30:00"]]

sampling:
  splunk/raw/payments_app:
    pipeline: "gateway log forwarder; request lines follow the caller's per-cart decision"
    key: cartId
    classes:
      - {name: lifecycle, gen: [log.startup, log.shutdown, log.startup_config], match: '\[(main|tomcat-shutdown)\] ', keep_1_in: 1, per: line}
      - {name: scheduler, gen: [log.bg_scheduler], match: '\[scheduling-\d+\] ', keep_1_in: 1, per: line}
      - {name: pool_stats, gen: [log.hikari_stats, log.hikari_stats_full], match: 'After cleanup  stats', keep_1_in: 4, per: housekeeper run, note: "the housekeeper runs every 30 s per host; one run in four is kept"}
      - {name: pool_growth, gen: [log.hikari_added], match: '\[HikariPool-1 connection adder\] \S+ - HikariPool-1 - Added connection', keep_1_in: 6, per: line}
      - {name: cannot_acquire, gen: [log.hikari_cannot_acquire], match: 'Cannot acquire connection from data source', keep_1_in: 24, per: attempt, note: "the connection adder retries every 10 s while the database refuses it"}
      - {name: health_check_failed, gen: [log.health], match: 'DB health check failed', keep_1_in: 14, per: line}
      - {name: authorize_ok, gen: [log.request_ok], match: ' - authorize ok txn=', keep_1_in: 1500, per: request}
      - {name: psp_slow_response, gen: [log.psp_ok_slow], match: ' - slow PSP response: ', keep_1_in: 12, per: request}
      - {name: psp_retry, gen: [log.psp_retry, log.psp_gave_up], match: ' - authorize (attempt \d+/\d+ timed out|failed txn=\S+ after \d+ attempts )', keep_1_in: 100, per: request, note: "a kept request keeps every attempt line and its final ERROR"}
      - {name: psp_fail_fast, gen: [log.psp_fail_fast], match: ' - authorize failed txn=\S+ after 1 attempt ', keep_1_in: 60, per: request}
      - {name: pool_timeout, gen: [log.hikari_timeout], match: '(SqlExceptionHelper - |: Could not open JPA EntityManager)', keep_1_in: 200, per: request, note: "the first kept request per host logs the full cause chain, later ones the one-line form"}
      - {name: leak_detection, gen: [log.hikari_leak, log.hikari_unleaked], match: '(ProxyLeakTask - Connection leak detection|was returned to the pool \(unleaked\))', keep_1_in: 400, per: request}
  splunk/raw/checkout_api:
    pipeline: "Kubernetes container log collector; request failures sampled per cart at source, request lines one in N"
    key: cartId
    classes:
      - {name: lifecycle, gen: [log.co_startup, log.co_shutdown], match: '"thread_name":"(main|SpringApplicationShutdownHook)"', keep_1_in: 1, per: line}
      - {name: gateway_failure, gen: [log.co_gw_timeout, log.co_gw_5xx], match: '"logger_name":"com.larkspur.checkout.payments.PaymentsGatewayClient"', keep_1_in: 100, per: request, note: "a kept request keeps its client ERROR"}
      - {name: request_error, gen: [log.co_db_timeout], match: '("level":"ERROR"|"logger_name":"org.hibernate.engine.jdbc.spi.SqlExceptionHelper"|"message":"POST /api/checkout/submit 50[0-9] )', keep_1_in: 100, per: request, note: "a kept request keeps every error line it wrote and its 5xx request line"}
      - {name: debug, gen: [log.co_debug_flood], match: '"level":"DEBUG"', keep_1_in: 70, per: line}
      - {name: audit_client, gen: [log.co_audit_slow], match: '"logger_name":"com.larkspur.checkout.audit.AuditSinkClient"', keep_1_in: 300, per: line}
      - {name: request, gen: [log.co_request], match: '"logger_name":"com.larkspur.checkout.web.RequestLogFilter"', keep_1_in: 2000, per: line, note: "not keyed by cart; successful submits do not join to gateway lines"}
      - {name: application, gen: [log.co_bg], match: '"level":"(INFO|WARN)"', keep_1_in: 1, per: line}
  splunk/raw/postgres:
    pipeline: "database host forwarder"
    key: backend pid
    note: "a 'connection received' line belongs to the session with the same pid"
    classes:
      - {name: connection, gen: [pg.connect, pg.gw_connect, pg.recon_connect, pg.dba_connect], match: 'LOG:  connection authorized: ', keep_1_in: 1, per: session}
      - {name: refused, gen: [pg.fatal_53300], match: 'FATAL:  remaining connection slots are reserved', keep_1_in: 12, per: session}
      - {name: terminated, gen: [pg.terminate_admin], match: 'FATAL:  terminating connection due to administrator command', keep_1_in: 1, per: line}
      - {name: eof_open_transaction, gen: [pg.eof_open_txn], match: 'LOG:  unexpected EOF on client connection with an open transaction', keep_1_in: 8, per: line}
      - {name: maintenance, gen: [pg.checkpoint, pg.autovacuum], match: 'LOG:  (checkpoint|automatic)', keep_1_in: 1, per: line}
  splunk/raw/nginx:
    pipeline: "edge log forwarder; submit requests follow checkout-api's per-cart decision (cartId is in the query string)"
    key: cartId
    classes:
      - {name: submit_server_error, gen: [nginx.submit_5xx], match: '"POST /api/checkout/submit\?cartId=\d+ HTTP/1\.1" 5\d\d ', keep_1_in: 200, per: request}
      - {name: submit, gen: [nginx.submit, nginx.cart_resubmit], match: '"POST /api/checkout/submit', keep_1_in: 600, per: request}
      - {name: checkout, gen: [nginx.request], match: '"(GET|POST) /api/checkout/', keep_1_in: 600, per: line}
      - {name: other, gen: [nginx.scanner], match: '" \d{3} ', keep_1_in: 1, per: line}
  splunk/raw/f5:
    pipeline: "BIG-IP remote syslog"
    classes:
      - {name: ltm, gen: [f5.member_flap], match: 'mcpd\[\d+\]: ', keep_1_in: 1, per: line}
  splunk/raw/k8s_events:
    pipeline: "Kubernetes event collector"
    classes:
      - {name: event, gen: [k8s.event, k8s.rollout, k8s.rollback, k8s.readiness_fail], match: '^\{', keep_1_in: 1, per: event}

log_shapes:
  hikari_stats: {every_s: 30}
  cannot_acquire: {every_s: 10}
  debug_flood: {window: ["14:28:40", "14:42:05"], lines_per_min: 1680}   # true volume from 2.14.3 pods
  checkout_background_every_s: 45
  gateway_background: {settlement_every_s: 300, token_every_s: 1800}
  postgres:
    dba_connect_at: "14:34:05.310"             # unused: nothing pages the DBA in this variant
    checkpoint_every_s: 1200
    autovacuum_tables: ["payments.public.authorizations", "orders.public.order_events", "payments.public.settlement_lines"]
  nginx:
    upstream_port: 8080
    host: edge-01

# ---------------------------------------------------------------------------------------------
# The model.
model:
  # Submits at checkout-api, one gateway authorization each when checkout-api gets a connection. Customers
  # resubmit after a 504 from 14:31 until the rollback clears it.
  authorization_rate_per_s: {points: [["10:00", 14], ["14:31", 14], ["14:33", 15], ["14:35", 17], ["14:38", 20], ["14:40", 21], ["14:42", 21], ["14:44", 17], ["14:48", 14], ["15:30", 14]]}
  eu_share: 0.25
  slow_share: {steps: [["00:00", 0.0]]}          # PayCore stays fast all afternoon
  psp_latency_ms:
    non_eu: [280, 560]
    eu_baseline: [1500, 2800]
    eu_ramp: []
    slow_attempt_s: [9, 12]
  hold_time_s: "1.05 + 36 * slow_share"
  little_law_checks: []                          # the gateway pools never move off their idle baseline

  # pay-db-01: the gateway at its idle baseline, order-service, the Datadog agent, and the reconciler's 40 from
  # 14:30 to 15:15:30. It peaks at 85 of 197 usable.
  connections:
    usable: 197
    rows:
      - {at: "13:45", gateway: [6, 6, 6, 6], order: 20, recon: 0, other: 1}
      - {at: "14:29", gateway: [6, 6, 6, 6], order: 20, recon: 0, other: 1}     # 45
      - {at: "14:30", gateway: [6, 6, 6, 6], order: 20, recon: 40, other: 1}    # 85, reconciler starts
      - {at: "15:16", gateway: [6, 6, 6, 6], order: 20, recon: 0, other: 1}     # 45, reconciler finished 15:15:30
    hikari_waiting: {points: [["00:00", 0]]}

  # checkout-api's pool to checkout-db on 2.14.3 pods (smalls_data/gen/model.py, checkout_db). The sink's latency
  # rises as the DEBUG flood fills it and stays until the last 2.14.3 pod is gone. Little's law per pod: demand
  # = submits a second / 6 x (0.7 + 3 x sink); the pool serves 40 / hold; the rest time out at 5000 ms.
  # 14:30 demand 47 (15% time out); 14:31 62 (35%); 14:33 75 (47%); 14:40 105 (62%).
  checkout_db:
    versions: ["2.14.3"]
    pool_per_pod: 40
    connection_timeout_ms: 5000
    base_hold_s: 0.7
    audit_writes_per_submit: 3
    audit_warn_over_ms: 2000
    audit_sink_latency_s: {points: [["00:00", 0.03], ["14:28:40", 0.03], ["14:29:00", 3.0], ["14:30:00", 6.5], ["14:31:00", 8.6], ["14:32:00", 9.8],
                                    ["14:42:05", 9.8], ["14:42:30", 0.03]]}
    other_active: 2
    baseline_error_pct: 0.2

  traffic_per_s:
    "GET /api/cart": {points: [["00:00", 30]]}
    "GET /api/checkout/summary": {points: [["00:00", 20]]}
    "POST /api/checkout/address": {points: [["00:00", 10]]}
    "POST /api/checkout/submit": {points: [["00:00", 14], ["14:31", 14], ["14:33", 15], ["14:35", 17], ["14:38", 20], ["14:40", 21], ["14:42", 21], ["14:44", 17], ["14:48", 14]]}
    storefront_browse: {points: [["00:00", 400]]}
  resubmit:
    from: "14:31:00"
    until: "14:46:00"
    per_cart: [2, 5]

  # checkout-api 5xx: derived from the checkout_db model (smalls_data/gen/model.py derived_error_rate).
  gw_latency_p90_s: {points: [["00:00", 0.62]]}
  gw_latency_p99_s: {points: [["00:00", 2.70]]}
  payment_success_rate_pct: {points: [["00:00", 98.5]]}
  redis_fragmentation_ratio:
    baseline: 1.32
    flap_peak: 1.62
    flap_every_h: 2
    since: "2026-10-07T14:00:00Z"

