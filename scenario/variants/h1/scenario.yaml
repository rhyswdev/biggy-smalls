      - {file: payments-gw.p99.json, query: "p99:trace.http.request.duration{service:checkout-api,peer.service:payments-gw,env:prod}", slice: true, kind: signal}
      - {file: postgresql.connections.by_db.json, query: "sum:postgresql.connections{host:pay-db-01} by {db}", slice: true, kind: signal}
      - {file: payments.authorize.success_rate.json, query: "avg:payments.authorize.success_rate{env:prod}", slice: true, kind: signal}
      - {file: storefront-web.hits.json, query: "sum:trace.servlet.request.hits{service:storefront-web,env:prod}", slice: true, kind: noise, tag: traffic-spike}
      - {file: redis-sessions.fragmentation.json, query: "avg:redis.mem.fragmentation_ratio{cluster:redis-sessions}", slice: true, kind: trap,
         window: ["2026-10-07T14:00:00Z", "2026-10-13T15:00:00Z"], interval_s: 3600}

