# Scenario: Larkspur Retail, checkout payments failing, 2026-10-13.
# The single source of every timestamp, count and number in bundles/larkspur-checkout-2026-10-13/.
# Never served. Times are UTC clock times on 2026-10-13 ("14:31:07.221") unless written as a full
# ISO date. `kind` is signal | trap | noise; every noise item has a `tag`: background, defect, or the
# trap it serves. `sig_id` names hand-written items; `class` names generated line classes.
# Bodies of hand-written content (messages, notes, runbooks) live in scenario/content/ and are keyed
# by the ids used here.

meta:
  bundle: larkspur-checkout-2026-10-13
  date: "2026-10-13"
  seed: 20261013
  t0: "14:00:00"            # epoch 1791900000

# When an observer could first see a record (manifest `t_known`; visibility is decided on it, PLAN 3.4).
# Documentation only: no code reads this. The rule per source is in smalls_data/parity.py (lint invariant
# 14), which re-derives every t_known from the served bytes. In short: a record's own time, except
#   metric points       known when the bucket closes (point time + interval)
#   change requests     sys_created_on (changes are raised before their work starts)
#   status snapshots    page.updated_at
#   Jenkins builds      building version at the start, finished version at start + duration
#   Dynatrace problems  open version at startTime, closed version at endTime
#   k8s events          lastTimestamp (the event object as served, count included)
#   webhook deliveries  the receipt time in the file name

checkpoints:
  - {id: "1440", at: "14:40:00", core: true}
  - {id: "1452", at: "14:52:00", core: true}
  - {id: "1515", at: "15:15:00", core: false, stretch: true}

# Tokens that must not be visible before a checkpoint (PLAN 3.4). Lint invariant 7.
future_tokens:
  "1452": ["CHG0031910", "#413", "parked in", "leak detector", "Degraded performance", "charged twice", "card declined"]
  "1440": ["CHG0031910", "#413", "parked in", "leak detector", "Degraded performance", "charged twice", "card declined",
           "idle in transaction", "pg_stat_activity", "rollback done", "#898"]

# ---------------------------------------------------------------------------------------------
# Size budget (PLAN section 2). Targets sit ~15% under the ceilings; the lint fails above a ceiling
# and reports any count outside +-20% of its target.
budget:
  ceilings: {log_lines: 5000, structured_records: 250, vendor_sources: 11}
  # Re-based after data fix 1 (constant rates, every Postgres connection pair): targets sum to 4,550,
  # about 9% under the ceiling; nginx (step 9) is sized to fit (docs/DATA.md).
  log_line_targets:
    splunk/raw/payments_app: 1950
    splunk/raw/checkout_api: 1300
    splunk/raw/postgres: 650
    splunk/raw/nginx: 570
    splunk/raw/f5: 20
    splunk/raw/k8s_events: 60
  structured_record_target: 210
  # Categories counted against the 250 ceiling (PLAN section 2 size-budget list). Slack messages,
  # commits, metric responses, status snapshots, saved searches, Dynatrace entities, Slack users and
  # channels, ServiceNow groups and Confluence pages are reported separately (see docs/DATA.md).
  counted: [datadog_events, datadog_monitors, datadog_synthetics, splunk_alerts, solarwinds_alerts, dynatrace_problems,
            servicenow_incidents, servicenow_journal, servicenow_audit, servicenow_changes, jenkins_builds,
            cmdb_ci, cmdb_rel_ci, servicenow_users, pagerduty_objects]

# ---------------------------------------------------------------------------------------------
# Log windows and sampling (PLAN section 2 "Log windows and sampling", data fix 1). Every raw log is a
# documented sample of what the estate wrote. One constant rate per line class for the whole window;
# no class changes rate partway through the incident. Request-path lines are kept per cart: checkout-api
# decides by hashing cartId and the decision travels with the call to the gateway, so a kept cart keeps
# every line of every one of its requests in both logs. Rates nest (a cart kept at 1 in 400 is also kept
# at 1 in 100). Each class lists the generator classes it covers (`gen`, never served), the pattern a
# tool uses to recognise its lines (`match`, on a record's first line) and `keep_1_in`. The block renders
# into the served integration.yaml without `gen`; lint invariant 15 checks the rates and the shape.
log_windows:
  payments_app: [["10:15:00", "10:30:00"], ["13:45:00", "15:30:00"]]
  checkout_api: [["13:45:00", "15:30:00"]]
  postgres: [["13:45:00", "15:30:00"]]
  nginx: [["13:45:00", "15:30:00"]]
  f5: [["14:30:00", "15:10:00"]]
  k8s_events: [["13:45:00", "15:30:00"]]

sampling:
  splunk/raw/payments_app:
    pipeline: "gateway log forwarder; request lines follow the caller's per-cart decision"
    key: cartId
    classes:
      - {name: lifecycle, gen: [log.startup, log.shutdown, log.startup_config], match: '\[(main|tomcat-shutdown)\] ', keep_1_in: 1, per: line}
      - {name: scheduler, gen: [log.bg_scheduler], match: '\[scheduling-\d+\] ', keep_1_in: 1, per: line}
      - {name: pool_stats, gen: [log.hikari_stats, log.hikari_stats_full], match: 'After cleanup  stats', keep_1_in: 4, per: housekeeper run, note: "the housekeeper runs every 30 s per host; one run in four is kept"}
      - {name: pool_growth, gen: [log.hikari_added], match: '\[HikariPool-1 connection adder\] \S+ - HikariPool-1 - Added connection', keep_1_in: 6, per: line}
      - {name: cannot_acquire, gen: [log.hikari_cannot_acquire], match: 'Cannot acquire connection from data source', keep_1_in: 24, per: attempt, note: "the connection adder retries every 10 s while the database refuses it"}
      - {name: health_check_failed, gen: [log.health], match: 'DB health check failed', keep_1_in: 14, per: line}
      - {name: authorize_ok, gen: [log.request_ok], match: ' - authorize ok txn=', keep_1_in: 1500, per: request}
      - {name: psp_slow_response, gen: [log.psp_ok_slow], match: ' - slow PSP response: ', keep_1_in: 12, per: request}
      - {name: psp_retry, gen: [log.psp_retry, log.psp_gave_up], match: ' - authorize (attempt \d+/\d+ timed out|failed txn=\S+ after \d+ attempts )', keep_1_in: 100, per: request, note: "a kept request keeps every attempt line and its final ERROR"}
      - {name: psp_fail_fast, gen: [log.psp_fail_fast], match: ' - authorize failed txn=\S+ after 1 attempt ', keep_1_in: 60, per: request}
      - {name: pool_timeout, gen: [log.hikari_timeout], match: '(SqlExceptionHelper - |: Could not open JPA EntityManager)', keep_1_in: 200, per: request, note: "the first kept request per host logs the full cause chain, later ones the one-line form"}
      - {name: leak_detection, gen: [log.hikari_leak, log.hikari_unleaked], match: '(ProxyLeakTask - Connection leak detection|was returned to the pool \(unleaked\))', keep_1_in: 400, per: request}
  splunk/raw/checkout_api:
    pipeline: "Kubernetes container log collector; gateway failures sampled per cart at source, request lines one in N"
    key: cartId
    classes:
      - {name: lifecycle, gen: [log.co_startup, log.co_shutdown], match: '"thread_name":"(main|SpringApplicationShutdownHook)"', keep_1_in: 1, per: line}
      - {name: gateway_failure, gen: [log.co_gw_timeout, log.co_gw_5xx], match: '("logger_name":"com.larkspur.checkout.payments.PaymentsGatewayClient"|"message":"POST /api/checkout/submit 50[0-9] )', keep_1_in: 100, per: request, note: "a kept request keeps its client ERROR and its 5xx request line"}
      - {name: debug, gen: [log.co_debug_flood], match: '"level":"DEBUG"', keep_1_in: 70, per: line}
      - {name: request, gen: [log.co_request], match: '"logger_name":"com.larkspur.checkout.web.RequestLogFilter"', keep_1_in: 2000, per: line, note: "not keyed by cart; successful submits do not join to gateway lines"}
      - {name: application, gen: [log.co_bg], match: '"level":"(INFO|WARN)"', keep_1_in: 1, per: line}
  splunk/raw/postgres:
    pipeline: "database host forwarder"
    key: backend pid
    note: "a 'connection received' line belongs to the session with the same pid"
    classes:
      - {name: connection, gen: [pg.connect, pg.gw_connect, pg.recon_connect, pg.dba_connect], match: 'LOG:  connection authorized: ', keep_1_in: 1, per: session}
      - {name: refused, gen: [pg.fatal_53300], match: 'FATAL:  remaining connection slots are reserved', keep_1_in: 12, per: session}
      - {name: terminated, gen: [pg.terminate_admin], match: 'FATAL:  terminating connection due to administrator command', keep_1_in: 1, per: line}
      - {name: eof_open_transaction, gen: [pg.eof_open_txn], match: 'LOG:  unexpected EOF on client connection with an open transaction', keep_1_in: 8, per: line}
      - {name: maintenance, gen: [pg.checkpoint, pg.autovacuum], match: 'LOG:  (checkpoint|automatic)', keep_1_in: 1, per: line}
  splunk/raw/nginx:
    pipeline: "edge log forwarder; submit requests follow checkout-api's per-cart decision (cartId is in the query string)"
    key: cartId
    classes:
      - {name: submit_server_error, gen: [nginx.submit_5xx], match: '"POST /api/checkout/submit\?cartId=\d+ HTTP/1\.1" 5\d\d ', keep_1_in: 200, per: request}
      - {name: submit, gen: [nginx.submit, nginx.cart_resubmit], match: '"POST /api/checkout/submit', keep_1_in: 600, per: request}
      - {name: checkout, gen: [nginx.request], match: '"(GET|POST) /api/checkout/', keep_1_in: 600, per: line}
      - {name: other, gen: [nginx.scanner], match: '" \d{3} ', keep_1_in: 1, per: line}
  splunk/raw/f5:
    pipeline: "BIG-IP remote syslog"
    classes:
      - {name: ltm, gen: [f5.member_flap], match: 'mcpd\[\d+\]: ', keep_1_in: 1, per: line}
  splunk/raw/k8s_events:
    pipeline: "Kubernetes event collector"
    classes:
      - {name: event, gen: [k8s.event, k8s.rollout, k8s.rollback, k8s.readiness_fail], match: '^\{', keep_1_in: 1, per: event}

# Generator settings for the classes above that are not rates.
log_shapes:
  hikari_stats: {every_s: 30}                  # the housekeeper period; pool_stats keeps 1 run in 4
  cannot_acquire: {every_s: 10}                # pay-04's connection adder retries while refused
  debug_flood: {window: ["14:28:40", "14:42:05"], lines_per_min: 1680}   # true volume from 2.14.3 pods
  checkout_background_every_s: 45
  gateway_background: {settlement_every_s: 300, token_every_s: 1800}
  postgres:
    dba_connect_at: "14:34:05.310"             # Elena on a reserved superuser slot, open until after the 14:56 kill
    checkpoint_every_s: 1200
    autovacuum_tables: ["payments.public.authorizations", "orders.public.order_events", "payments.public.settlement_lines"]
  nginx:
    upstream_port: 8080
    host: edge-01

# ---------------------------------------------------------------------------------------------
# The model. Curves are piecewise: `steps` hold a value from each point until the next;
# `points` interpolate linearly between points. Every metric, every Hikari stats line, every
# pg_stat_activity count and every number in a note derives from here.
model:
  authorization_rate_per_s: {points: [["10:00", 14], ["14:35", 14], ["14:45", 24], ["15:06", 24], ["15:12", 16], ["15:24", 15], ["15:30", 14]]}
  eu_share: 0.25
  slow_share:          # share of all authorizations whose PayCore attempts exceed 8 s (EU edge only)
    steps: [["00:00", 0.0], ["14:26", 0.02], ["14:30", 0.09], ["14:31", 0.17], ["14:32", 0.22], ["14:33", 0.25], ["15:24", 0.0]]
  psp_latency_ms:      # rendered latency of attempts that are not slow
    non_eu: [280, 560]
    eu_baseline: [1500, 2800]          # cross-region edge; with app and DB work the hold is ~3 s (PLAN 1.2 hold model)
    eu_ramp:           # PayCore EU degradation begins 14:24, under 8 s until 14:26
      - {from: "14:24:00", to: "14:25:00", range: [2600, 4800]}
      - {from: "14:25:00", to: "14:26:00", range: [4200, 7600]}
      - {from: "14:26:00", to: "15:24:00", range: [3400, 7900]}
    slow_attempt_s: [9, 12]            # always cut at the client timeout
  hold_time_s: "1.05 + 36 * slow_share"   # PLAN 1.2; Little's law lint at 14:29, 14:31, 14:33
  little_law_checks: ["14:29", "14:31", "14:33"]

  # Connections on pay-db-01 by minute (PLAN 1.3). Rows hold until the next row.
  connections:
    usable: 197
    rows:
      - {at: "13:45", gateway: [6, 6, 6, 6], order: 20, recon: 0, other: 1}
      - {at: "14:29", gateway: [6, 6, 6, 6], order: 20, recon: 0, other: 1}     # 45, baseline
      - {at: "14:30", gateway: [15, 16, 15, 14], order: 20, recon: 40, other: 1}   # 121
      - {at: "14:31", gateway: [24, 35, 22, 19], order: 20, recon: 40, other: 1}   # 161, pay-02 hits 35
      - {at: "14:32", gateway: [32, 35, 31, 27], order: 20, recon: 40, other: 1}   # 186
      - {at: "14:33", gateway: [35, 35, 35, 31], order: 20, recon: 40, other: 1}   # 197, ceiling
      - {at: "14:34", gateway: [35, 35, 35, 32], order: 20, recon: 40, other: 0}   # 197, Datadog agent refused
      - {at: "15:02", gateway: [5, 35, 35, 32], order: 20, recon: 40, other: 0}    # pay-01 restarted on 3.7.9
      - {at: "15:03", gateway: [5, 5, 35, 32], order: 20, recon: 40, other: 0}
      - {at: "15:04", gateway: [6, 5, 5, 32], order: 20, recon: 40, other: 0}
      - {at: "15:05", gateway: [6, 6, 5, 5], order: 20, recon: 40, other: 0}
      - {at: "15:06", gateway: [6, 6, 6, 5], order: 20, recon: 40, other: 0}
      - {at: "15:08", gateway: [7, 6, 6, 6], order: 20, recon: 40, other: 1}       # 86 (gateway 25)
      - {at: "15:16", gateway: [6, 6, 6, 6], order: 20, recon: 0, other: 1}        # reconciler finished 15:15:30
    # Hikari pool state per VM (total from rows above). waiting = threads queued for a connection.
    hikari_waiting: {points: [["14:30", 0], ["14:31", 12], ["14:33", 18], ["14:45", 26], ["15:01", 26], ["15:02", 0]]}
    # During saturation the DBA sees ~133 of the gateway's 137 sessions idle in transaction (PLAN 1.4 14:47):
    # at ~14 authorizations a second with millisecond inserts only a handful are ever `active` (data fix 7).
    pgsa_snapshot:
      at: "14:47:12"
      gateway_idle_in_txn: 133
      gateway_active: 4
      recon_active: 40
      order_idle: 20
      oldest_xact_age_s: 38
      wait_event: ClientRead
    kill_sessions: {at: "14:56:00", count: 30, refill_within_s: 4, demand_connections: 240, slots: 137, error_rate_effect: "barely moves"}

  # checkout-api traffic by endpoint (requests per second).
  traffic_per_s:
    "GET /api/cart": {points: [["00:00", 30]]}
    "GET /api/checkout/summary": {points: [["00:00", 20]]}
    "POST /api/checkout/address": {points: [["00:00", 10]]}
    "POST /api/checkout/submit": {points: [["00:00", 14], ["14:35", 14], ["14:45", 24], ["15:06", 24], ["15:12", 16], ["15:24", 15], ["15:30", 14]]}
    storefront_browse: {points: [["00:00", 400]]}
  resubmit:            # customer retries: the same cart resubmits 2 to 5 times
    from: "14:35:00"
    until: "15:08:00"
    per_cart: [2, 5]

  checkout_error_rate_pct:    # all checkout-api requests, 5xx
    points: [["00:00", 0.2], ["14:25", 0.2], ["14:26", 0.4], ["14:27", 0.45], ["14:28", 2.1], ["14:29", 0.6], ["14:30", 1.4],
             ["14:31", 3.0], ["14:32", 5.8], ["14:33", 9.0], ["14:34", 11.5], ["14:35", 14.0], ["14:40", 15.5], ["14:45", 17.0],
             ["14:56", 16.6], ["15:00", 17.0], ["15:02", 15.0], ["15:04", 10.0], ["15:06", 4.0], ["15:07", 1.0], ["15:08", 0.2]]
  gw_latency_p90_s:            # checkout-api client spans to peer.service:payments-gw
    points: [["00:00", 0.62], ["14:23", 0.62], ["14:24", 0.70], ["14:25", 1.10], ["14:26", 1.30], ["14:29", 1.50], ["14:30", 3.40],
             ["14:31", 8.60], ["14:32", 10.0], ["15:05", 10.0], ["15:06", 3.0], ["15:24", 3.0], ["15:25", 0.62]]
  gw_latency_p99_s:
    points: [["00:00", 2.70], ["14:23", 2.70], ["14:24", 3.90], ["14:25", 6.80], ["14:26", 10.0], ["15:05", 10.0], ["15:06", 3.10],
             ["15:24", 3.05], ["15:25", 2.70]]
  payment_success_rate_pct:
    points: [["00:00", 98.5], ["14:30", 98.5], ["14:31", 96.0], ["14:32", 88.0], ["14:33", 79.0], ["14:34", 70.0], ["14:35", 64.0],
             ["14:40", 60.0], ["14:45", 58.0], ["15:01", 58.0], ["15:04", 63.0], ["15:06", 72.0], ["15:08", 73.0], ["15:24", 73.0],
             ["15:25", 97.0], ["15:26", 98.5]]
  redis_fragmentation_ratio:   # hourly over six days; the flap
    baseline: 1.32
    flap_peak: 1.62
    flap_every_h: 2
    since: "2026-10-07T14:00:00Z"

