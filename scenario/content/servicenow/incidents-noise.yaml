noise_01:
  opened_at: "2026-04-14 09:12"
  resolved_after_min: 47
  short_description: "Storefront 502s for about 25 min after CDN origin TLS certificate expired"
  description: |-
    Synthetic checks against the storefront have returned HTTP 502 from the edge in every region since about 09:05 ET. The CDN origin certificate appears to have expired.
  cmdb_ci: "Storefront Web"
  business_service: "Online Checkout"
  priority: 3
  impact: "2 - Medium"
  urgency: "2 - Medium"
  category: Network
  contact_type: Monitoring
  assignment_group: "Web Platform"
  assigned_to: kofi.mensah
  caller: svc-datadog
  close_code: "Solved (Permanently)"
  close_notes: |-
    The origin certificate expired at 09:04 ET. The renewal job still pointed at a retired origin hostname, so it never fired. Certificate reissued and deployed to the origin at 09:31 ET, and the 502s cleared within two minutes. Added an expiry monitor on all CDN origin certificates alerting at 30 and 7 days, and corrected the hostname list in the renewal job.
  work_notes:
    - {after_min: 6, by: kofi.mensah, text: "Origin cert on the CDN shows expired at 09:04 ET. Renewal job did not fire, checking why."}
    - {after_min: 12, by: kofi.mensah, text: "Renewal job config still lists the old origin hostname. Reissuing against the current one."}
    - {after_min: 19, by: kofi.mensah, text: "New cert live on origin. Edge 502 rate back to zero. Expiry monitor added, closing once the job config change is merged."}
noise_02:
  opened_at: "2026-05-06 13:40"
  resolved_after_min: 118
  short_description: "Order confirmation emails delayed up to 2 hours, SMTP relay queue backlog"
  description: |-
    Customer service reports order confirmation emails arriving up to two hours after purchase. The SMTP relay queue is backing up and nothing is failing outright.
  cmdb_ci: "Order Service"
  business_service: "Online Checkout"
  priority: 3
  impact: "2 - Medium"
  urgency: "2 - Medium"
  category: Software
  contact_type: Email
  assignment_group: "Commerce Platform"
  assigned_to: alice.nguyen
  caller: ben.kowalski
  close_code: "Solved (Permanently)"
  close_notes: |-
    The relay host root volume reached 100 percent at 12:58 ET, so the queue stopped spooling and then drained slowly once space was freed. Old bounce logs and the spool archive were removed, the volume was extended by 40 GB, and the queue was empty by 15:38 ET. Follow-up: move the relay spool onto its own volume and add a disk alert at 80 percent.
  work_notes:
    - {after_min: 14, by: alice.nguyen, text: "Order Service emails are queued on the relay, not failing. Checking queue depth."}
    - {after_min: 41, by: alice.nguyen, text: "Relay root volume is full. Freeing space from bounce logs and the old spool archive, then extending the volume."}
    - {after_min: 70, by: alice.nguyen, text: "Volume extended by 40 GB. Queue draining, around 3200 messages left."}
