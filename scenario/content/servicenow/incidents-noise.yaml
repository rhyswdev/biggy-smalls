noise_04:
  opened_at: "2026-06-18 22:10"
  resolved_after_min: 96
  short_description: "Node disk pressure evicted storefront pods on two k8s-prod-east nodes"
  description: |-
    Two k8s-prod-east nodes reported DiskPressure at about 22:05 ET and storefront pods were evicted from both. Remaining replicas are serving traffic but the deployment is below its desired count.
  cmdb_ci: "k8s-prod-east"
  business_service: "Online Checkout"
  priority: 3
  impact: "2 - Medium"
  urgency: "2 - Medium"
  category: Software
  contact_type: Monitoring
  assignment_group: "Platform Reliability"
  assigned_to: sam.ortega
  caller: svc-datadog
  close_code: "Solved (Permanently)"
  close_notes: |-
    Image garbage collection only started at 90 percent root disk usage, so unused storefront image layers built up until kubelet eviction started first. Image GC thresholds were lowered to start at 70 percent and stop at 60 percent, and the evicted pods rescheduled cleanly. Follow-up: move image storage to the larger data disk when the nodes are rebuilt.
  work_notes:
    - {after_min: 7, by: sam.ortega, text: "Two nodes in DiskPressure. Eviction list is storefront pods only. Cordoning both nodes for now."}
    - {after_min: 35, by: sam.ortega, text: "Root disk usage was at 91 percent on both. Mostly unused image layers from the last release cycle."}
    - {after_min: 80, by: sam.ortega, text: "Image GC thresholds lowered and applied. Nodes back under 60 percent. Uncordoned, pods rescheduled."}
