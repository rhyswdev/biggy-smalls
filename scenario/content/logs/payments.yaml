# Leak detection (ProxyLeakTask, WARN with the exception captured at borrow time; Hikari trims its own
# first frames). The trace reaches the transactional proxy of PaymentService.authorize.
hikari_leak:
  head: [WARN, housekeeper, hikari_leak, "Connection leak detection triggered for org.postgresql.jdbc.PgConnection@{conn} on thread {thread}, stack trace follows"]
  trace:
    - "java.lang.Exception: Apparent connection leak detected"
    - "\tat com.zaxxer.hikari.HikariDataSource.getConnection(HikariDataSource.java:128)"
    - "\tat org.hibernate.engine.jdbc.connections.internal.DatasourceConnectionProviderImpl.getConnection(DatasourceConnectionProviderImpl.java:122)"
    - "\tat org.hibernate.internal.NonContextualJdbcConnectionAccess.obtainConnection(NonContextualJdbcConnectionAccess.java:46)"
    - "\tat org.hibernate.resource.jdbc.internal.LogicalConnectionManagedImpl.acquireConnectionIfNeeded(LogicalConnectionManagedImpl.java:113)"
    - "\tat org.hibernate.resource.jdbc.internal.LogicalConnectionManagedImpl.getPhysicalConnection(LogicalConnectionManagedImpl.java:143)"
    - "\tat org.hibernate.resource.jdbc.internal.LogicalConnectionManagedImpl.getConnectionForTransactionManagement(LogicalConnectionManagedImpl.java:273)"
    - "\tat org.hibernate.resource.jdbc.internal.AbstractLogicalConnectionImplementor.begin(AbstractLogicalConnectionImplementor.java:71)"
    - "\tat org.hibernate.resource.transaction.backend.jdbc.internal.JdbcResourceLocalTransactionCoordinatorImpl$TransactionDriverControlImpl.begin(JdbcResourceLocalTransactionCoordinatorImpl.java:232)"
    - "\tat org.hibernate.engine.transaction.internal.TransactionImpl.begin(TransactionImpl.java:83)"
    - "\tat org.springframework.orm.jpa.vendor.HibernateJpaDialect.beginTransaction(HibernateJpaDialect.java:164)"
    - "\tat org.springframework.orm.jpa.JpaTransactionManager.doBegin(JpaTransactionManager.java:420)"
    - "\tat org.springframework.transaction.support.AbstractPlatformTransactionManager.startTransaction(AbstractPlatformTransactionManager.java:532)"
    - "\tat org.springframework.transaction.support.AbstractPlatformTransactionManager.getTransaction(AbstractPlatformTransactionManager.java:405)"
    - "\tat org.springframework.transaction.interceptor.TransactionAspectSupport.createTransactionIfNecessary(TransactionAspectSupport.java:617)"
    - "\tat org.springframework.transaction.interceptor.TransactionAspectSupport.invokeWithinTransaction(TransactionAspectSupport.java:386)"
    - "\tat org.springframework.transaction.interceptor.TransactionInterceptor.invoke(TransactionInterceptor.java:119)"
    - "\tat org.springframework.aop.framework.ReflectiveMethodInvocation.proceed(ReflectiveMethodInvocation.java:184)"
    - "\tat org.springframework.aop.framework.CglibAopProxy$CglibMethodInvocation.proceed(CglibAopProxy.java:765)"
    - "\tat org.springframework.aop.framework.CglibAopProxy$DynamicAdvisedInterceptor.intercept(CglibAopProxy.java:717)"
    - "\tat com.larkspur.payments.service.PaymentService$$SpringCGLIB$$0.authorize(<generated>)"
  unleaked: [INFO, request, hikari_leak, "Previously reported leaked connection org.postgresql.jdbc.PgConnection@{conn} on thread {thread} was returned to the pool (unleaked)"]
