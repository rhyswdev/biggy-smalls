    - "\t... 55 common frames omitted"
    - "Caused by: java.sql.SQLTransientConnectionException: HikariPool-1 - Connection is not available, request timed out after 5000ms (total={t}, active={a}, idle={i}, waiting={w})"
    - "\tat com.zaxxer.hikari.pool.HikariPool.createTimeoutException(HikariPool.java:686)"
    - "\tat com.zaxxer.hikari.pool.HikariPool.getConnection(HikariPool.java:179)"
    - "\tat com.zaxxer.hikari.pool.HikariPool.getConnection(HikariPool.java:144)"
