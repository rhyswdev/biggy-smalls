    - "\tat org.hibernate.engine.transaction.internal.TransactionImpl.begin(TransactionImpl.java:83)"
    - "\tat org.springframework.orm.jpa.vendor.HibernateJpaDialect.beginTransaction(HibernateJpaDialect.java:164)"
