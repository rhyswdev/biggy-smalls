# One service: the app. The store is in-process SQLite, so there is no database service. A later step that
# needs a server (a UI, an agent service) arrives here as another service.
#   docker compose run --rm smalls make test
services:
  smalls:
    build: .
    image: smalls:dev
    working_dir: /app
    volumes:
      - .:/app
    # Only `make tag` needs a key (JEV_API_KEY). Everything else runs without .env.
    env_file:
      - path: .env
        required: false
