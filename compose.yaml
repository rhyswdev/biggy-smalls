# One service: the app. The store is in-process SQLite, so there is no database service. A later step that
# needs a server (a UI, an agent service) arrives here as another service.
#   docker compose run --rm smalls make test
services:
  smalls:
    build: .
    image: smalls:dev
    working_dir: /app
    volumes:
      - .:/app
    # Only `make tag` needs a key (JEV_API_KEY). Everything else runs without .env.
    env_file:
      - path: .env
        required: false
    # The agent's settings, passed through by name when set on the host. No key is named here: keys arrive
    # only through env_file. SMALLS_RUNNER tells a run it was started through compose, so a resume hint
    # prints the compose form of the command.
    environment:
      - SMALLS_TAGS
      - SMALLS_PROFILE
      - SMALLS_MODEL
      - SMALLS_COMMIT
      - SMALLS_LIVE
      - SMALLS_RUNNER=compose
